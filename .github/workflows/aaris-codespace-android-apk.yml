name: Aaris Android APK on existing Codespace to GitHub Release
on:
  push:
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only APK preflight or build and publish debug test APK'
        required: true
        type: choice
        options: [preflight, build, build_hud]
        default: preflight
      machine:
        description: 'Optional exact existing authorized Codespace name (required if multiple)'
        required: false
        type: string
permissions:
  contents: read
  issues: read
jobs:
  codespace-android-apk:
    if: >-
      (github.event_name == 'push' &&
       github.actor == 'sundamunda289-art' &&
       contains(github.event.head_commit.message, '[build-apk]')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor == 'sundamunda289-art') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 77 &&
       github.event.comment.user.login == 'sundamunda289-art' &&
       (github.event.comment.body == 'APK PREFLIGHT' ||
        (github.event.comment.body == 'APK BUILD' ||
        github.event.comment.body == 'APK HUD BUILD' ||
        startsWith(github.event.comment.body, 'APK BUILD SHA '))))
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      # Read-only preflight does not hold the long native Editor build queue.
      # Actual APK builds remain serialized with every other Unity command.
      group: ${{ ((github.event_name == 'issue_comment' && github.event.comment.body == 'APK PREFLIGHT') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'preflight')) && 'aaris-apk-preflight' || 'aaris-codespace-control' }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
      OPERATION: ${{ github.event_name == 'push' && 'build' || github.event_name == 'workflow_dispatch' && inputs.operation || (github.event.comment.body == 'APK HUD BUILD' && 'build_hud' || (github.event.comment.body == 'APK BUILD' || startsWith(github.event.comment.body, 'APK BUILD SHA ')) && 'build' || 'preflight') }}
      # The run's immutable main commit supplies the game and its bundled audio.
      AARIS_EXPECTED_BUILD_SHA: ${{ github.sha }}
      AARIS_CONTROLLER_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact latest main controller and APK builder
        uses: actions/checkout@v4
        with:
          # Pin the controller checkout to the triggering commit, even if
          # main advances while earlier APK runs are cancelling.
          ref: ${{ github.sha }}
          lfs: false
          persist-credentials: false
      - name: Validate reviewer-controlled APK scripts and scene settings
        run: |
          set -euo pipefail
          bash -n Tools/Codespaces/android_apk.sh
          test -s Assets/AarisWorld/Editor/AarisCodespaceAndroidBuild.cs
          test -s Assets/AarisWorld/Editor/AarisCodespaceAndroidBuild.cs.meta
          grep -q 'm_EditorVersion: 6000.3.26f1' ProjectSettings/ProjectVersion.txt
          grep -q 'path: Assets/TerrainDemoScene_URP/Scenes/TerrainDemoScene.unity' ProjectSettings/EditorBuildSettings.asset
          test "$(git rev-parse HEAD)" = "$AARIS_CONTROLLER_SHA" || { echo APK_WORKFLOW_CHECKOUT_NOT_EVENT_COMMIT; exit 15; }
          mkdir -p apk-evidence
          echo "APK_STATIC_SCENE_AND_BUILDER_VALID"
      - name: Verify pinned APK source and exact Codespace from owner request
        if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, 'APK BUILD SHA ')
        env:
          AARIS_OWNER_BUILD_REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # The comment is data only: strict validation, never shell execution.
          if [[ "$AARIS_OWNER_BUILD_REQUEST" =~ ^APK[[:space:]]BUILD[[:space:]]SHA[[:space:]]([0-9a-f]{40})[[:space:]]MACHINE[[:space:]]([A-Za-z0-9-]{3,110})$ ]]; then
            SOURCE_SHA="${BASH_REMATCH[1]}"
            REQUESTED_MACHINE="${BASH_REMATCH[2]}"
          else
            echo APK_OWNER_PINNED_REQUEST_INVALID
            exit 14
          fi
          # Prove the exact immutable commit belongs to this public repo.
          git fetch --quiet --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$SOURCE_SHA" || {
            echo APK_REQUESTED_COMMIT_FETCH_FAILED; exit 14;
          }
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA" || {
            echo APK_REQUESTED_COMMIT_MISMATCH; exit 14;
          }
          echo "AARIS_EXPECTED_BUILD_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "AARIS_REQUESTED_MACHINE=$REQUESTED_MACHINE" >> "$GITHUB_ENV"
          echo APK_OWNER_PINNED_SOURCE_AND_MACHINE_VERIFIED
      - name: Select an existing authorized Codespace without creating another
        env:
          REQUESTED_CODESPACE: ${{ github.event_name == 'workflow_dispatch' && inputs.machine || '' }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'APK_CODESPACE_PAT_MISSING'; exit 10; }
          # The authenticated Codespace may be hosted in an authorized fork,
          # while the immutable source/build controller stays in the main repo.
          # Do not use -R "$GITHUB_REPOSITORY" here: that silently hides forks.
          # No fallback to an arbitrary machine and no Codespace creation.
          MATCHES="$(gh codespace list --json name,state,repository --limit 100 |
            jq -c '[.[] | select(
              ((if (.repository | type) == "string" then .repository
                 else (.repository.nameWithOwner // .repository.full_name // "") end)
                | test("^[^/]+/Unity-Game-Aris$")))]')"
          if test -n "${AARIS_REQUESTED_MACHINE:-}"; then
            REQUESTED_CODESPACE="$AARIS_REQUESTED_MACHINE"
          fi
          if test -n "${REQUESTED_CODESPACE:-}"; then
            [[ "$REQUESTED_CODESPACE" =~ ^[A-Za-z0-9-]{3,110}$ ]] || {
              echo APK_CODESPACE_NAME_INVALID; exit 12;
            }
            CHOICE="$(jq -cer --arg n "$REQUESTED_CODESPACE" '[.[] | select(.name == $n)] | if length == 1 then .[0] else empty end' <<< "$MATCHES")" || {
                echo APK_REQUESTED_CODESPACE_NOT_FOUND; exit 11;
              }
          else
            # Refuse ambiguous accounts. The owner can dispatch with 'machine'
            # instead of accidentally building in a different Codespace.
            CHOICE="$(jq -cer 'if length == 1 then .[0] else empty end' <<< "$MATCHES")" || {
                echo APK_CODESPACE_SELECTION_AMBIGUOUS_OR_EMPTY; exit 11;
              }
          fi
          CS="$(jq -er '.name' <<< "$CHOICE")"
          CS_STATE="$(jq -er '.state' <<< "$CHOICE")"
          echo APK_EXACT_OWNER_CODESPACE_CONFIRMED
          case "$CS_STATE" in
            Available) echo APK_CODESPACE_ALREADY_AVAILABLE ;;
            Shutdown|Stopped)
              gh api -X POST "/user/codespaces/$CS/start" >/dev/null || {
                echo APK_CODESPACE_START_FAILED; exit 11;
              }
              echo APK_CODESPACE_START_REQUESTED
              ;;
            Starting|Queued|Provisioning|Rebuilding) echo APK_CODESPACE_START_IN_PROGRESS ;;
            *) echo APK_CODESPACE_STATE_UNSAFE; exit 11 ;;
          esac
          for attempt in $(seq 1 24); do
            CURRENT="$(gh codespace view -c "$CS" --json state --jq .state 2>/dev/null || true)"
            if test "$CURRENT" = Available; then break; fi
            sleep 10
          done
          test "$CURRENT" = Available || { echo APK_CODESPACE_NOT_AVAILABLE; exit 11; }
          echo APK_CODESPACE_AVAILABLE
          echo "CODESPACE=$CS" >> "$GITHUB_ENV"
          echo APK_CODESPACE_SELECTED
      - name: Perform live Unity license and Android tools preflight
        timeout-minutes: 6
        run: |
          set -euo pipefail
          # Safe to retry: preflight is read-only and never starts a Unity build.
          # Keep SSH alive through transient quiet periods and fail closed after
          # bounded attempts. Never select another Codespace.
          preflight_ok=0
          for attempt in 1 2 3; do
            if timeout 90 gh codespace ssh -c "$CODESPACE" -- \
                -o ConnectTimeout=20 -o ConnectionAttempts=3 \
                -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
                'bash -s -- preflight' \
                < Tools/Codespaces/android_apk.sh > apk-evidence/preflight.txt \
                2> "$RUNNER_TEMP/private-codespace-errors.log" &&
                grep -qxF 'APK_PREFLIGHT_RECORDED' apk-evidence/preflight.txt; then
              preflight_ok=1
              break
            fi
            echo "APK_PREFLIGHT_CONNECTION_RETRY_$attempt"
            if test "$attempt" -lt 3; then sleep 5; fi
          done
          test "$preflight_ok" = 1 || { echo APK_PREFLIGHT_REMOTE_FAILED; exit 13; }
          # Redacted checked-in shell outputs only fixed classifications.
          grep -E '^APK_[A-Z_]+$|^apk_(android_module|android_sdk|android_ndk|android_jdk|tmp_free_gb)=[A-Za-z0-9.]+$' \
              apk-evidence/preflight.txt > apk-evidence/preflight-safe.txt
          cat apk-evidence/preflight-safe.txt
      - name: Install official Unity Android modules and build APK on Codespace
        if: env.OPERATION != 'preflight'
        timeout-minutes: 290
        run: |
          set -euo pipefail
          # Never execute untrusted Issue content as shell commands.
          # SSH does not inherit the Actions runner's environment. Pass the
          # fixed, 40-hex reviewed source SHA to the remote build explicitly.
          if test "$OPERATION" = build_hud; then
            AARIS_EXPECTED_BUILD_SHA="$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" \
              refs/heads/fix/android-ugui-shader-parachute-20261110 | cut -f1)"
          fi
          [[ "$AARIS_EXPECTED_BUILD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 18
          # Do not start a second Unity Editor over an in-flight Codespace build
          # or the user's existing GUI session. The remote editor may still be
          # working even if its Cloudflare status bridge has gone offline.
          if timeout 60 gh codespace ssh -c "$CODESPACE" -- \
              -o ConnectTimeout=20 -o ServerAliveInterval=20 \
              'bash -lc "if pgrep -x Unity >/dev/null; then echo APK_EDITOR_ALREADY_ACTIVE; else echo APK_EDITOR_AVAILABLE; fi"' \
              > apk-evidence/editor-guard.txt 2> "$RUNNER_TEMP/private-editor-guard-errors.log"; then
            if grep -qxF APK_EDITOR_ALREADY_ACTIVE apk-evidence/editor-guard.txt; then
              echo APK_EXISTING_UNITY_EDITOR_ACTIVE_NO_DUPLICATE_BUILD
              exit 27
            fi
            grep -qxF APK_EDITOR_AVAILABLE apk-evidence/editor-guard.txt || {
              echo APK_EDITOR_GUARD_UNEXPECTED_RESULT; exit 27;
            }
          else
            echo APK_EDITOR_STATUS_CHECK_CONNECTION_FAILED
            exit 27
          fi
          # A single long-lived SSH stream carries the expensive Unity build.
          # Keep it alive during silent asset import; do NOT blindly retry the
          # build itself after disconnection (which could start a second Editor).
          timeout 16900 gh codespace ssh -c "$CODESPACE" -- \
            -o ConnectTimeout=30 -o ConnectionAttempts=3 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "env AARIS_EXPECTED_BUILD_SHA=$AARIS_EXPECTED_BUILD_SHA bash -s -- $OPERATION" \
            < Tools/Codespaces/android_apk.sh > apk-evidence/build-status.txt \
            2> "$RUNNER_TEMP/private-apk-build-ssh-errors.log" || {
            echo 'APK_NATIVE_CODESPACE_BUILD_FAILED'
            grep -E '^APK_[A-Z0-9_]+$|^apk_(android_module|android_sdk|android_ndk|android_jdk)=[A-Za-z0-9.]+$' apk-evidence/build-status.txt > apk-evidence/build-status-safe.txt || true
            cat apk-evidence/build-status-safe.txt
            exit 20
          }
          grep -qxF 'APK_UPLOAD_READY' apk-evidence/build-status.txt
          grep -qxF 'APK_INSTALLABILITY_SIGNATURE_MANIFEST_API33_VERIFIED' apk-evidence/build-status.txt
          grep -qxF 'APK_AUTHENTIC_822_LFS_VERIFIED' apk-evidence/build-status.txt || grep -qxF 'APK_REMOTE_822_LFS_SHA256_VERIFIED' apk-evidence/build-status.txt
          grep -qxF "apk_commit=$AARIS_EXPECTED_BUILD_SHA" apk-evidence/build-status.txt
          grep -E '^APK_[A-Z0-9_]+$|^apk_bytes=[0-9]+$|^apk_commit=[0-9a-f]{40}$' apk-evidence/build-status.txt > apk-evidence/build-status-safe.txt
          cat apk-evidence/build-status-safe.txt
      - name: Copy and SHA-256 verify actual APK from Codespace
        if: env.OPERATION != 'preflight'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p dist
          # Legacy GH CLI SCP rejected an existing absolute remote APK path.
          # -e uses actual remote-path expansion; SSH binary stream is a
          # checksum-validated fallback, not another Unity build.
          if ! timeout 1100 gh codespace cp -e -c "$CODESPACE" \
            'remote:/tmp/aaris-codespaces/android-apk/Build/AarisGame.apk' \
            dist/AarisGame.apk; then
            rm -f dist/AarisGame.apk
            # Binary copy fallback: retry transport, not the Unity build.
            # Only accept a nonempty file and verify its remote SHA below.
            transferred=0
            for attempt in 1 2 3; do
              if timeout 360 gh codespace ssh -c "$CODESPACE" -- \
                  -o ConnectTimeout=20 -o ServerAliveInterval=30 \
                  -o ServerAliveCountMax=6 \
                  'cat /tmp/aaris-codespaces/android-apk/Build/AarisGame.apk' \
                  > dist/AarisGame.apk && test -s dist/AarisGame.apk; then
                transferred=1; break
              fi
              rm -f dist/AarisGame.apk
              if test "$attempt" -lt 3; then sleep 5; fi
            done
            test "$transferred" = 1 || { echo APK_TRANSFER_CONNECTION_FAILED; exit 23; }
          fi
          hash_received=0
          for attempt in 1 2 3; do
            if timeout 60 gh codespace ssh -c "$CODESPACE" -- \
                -o ConnectTimeout=20 -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=6 \
                'cat /tmp/aaris-codespaces/android-apk/apk-sha256.txt' \
                > dist/AarisGame.sha256 && test -s dist/AarisGame.sha256; then
              hash_received=1; break
            fi
            if test "$attempt" -lt 3; then sleep 5; fi
          done
          test "$hash_received" = 1 || { echo APK_SHA256_CONNECTION_FAILED; exit 24; }
          cd dist
          sha256sum -c AarisGame.sha256
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path("AarisGame.apk")
          assert 100000<p.stat().st_size<2_000_000_000
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              assert "AndroidManifest.xml" in names
              assert any(n.endswith(".dex") for n in names)
          print("APK_RELEASE_BYTES_VERIFIED")
          PY
      - name: Publish validated installable APK as GitHub Release asset
        if: env.OPERATION != 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-test-$GITHUB_RUN_ID"
          BUILD_SOURCE="main"
          APK_ABIS="ARMv7 and ARM64"
          if test "$OPERATION" = build_hud; then
            APK_ABIS="ARM64"
            TAG="apk-hud-review-$GITHUB_RUN_ID"
            BUILD_SOURCE="fixed HUD/parachute review branch"
            grep -qxF APK_HUD_REVIEW_BUILD_VERIFIED apk-evidence/build-status.txt
          fi
          SHA="$(grep '^apk_commit=' apk-evidence/build-status-safe.txt | head -n1 | cut -d= -f2)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 31
          cat > apk-evidence/release-notes.md <<EOF
          Temporary offline single-player Android test APK ($APK_ABIS), signed with the Unity debug key.
          Unity source snapshot: $SHA ($BUILD_SOURCE).
          Native 2 km x 2 km scene: Assets/TerrainDemoScene_URP/Scenes/TerrainDemoScene.unity (four terrain tiles).
          Download AarisGame.apk from Assets; verify with AarisGame.sha256 before installing.
          This is a test build, not a Google Play production release. Android device FPS, crashes,
          touch controls and real collision behavior must still be tested on a phone.
          EOF
          gh release create "$TAG" dist/AarisGame.apk dist/AarisGame.sha256 \
            -R "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "Aaris Android Test APK - $GITHUB_RUN_ID" \
            --notes-file apk-evidence/release-notes.md --prerelease
          printf 'release_tag=%s\n' "$TAG" > apk-evidence/release-result.txt
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url \
            --jq .url >> apk-evidence/release-result.txt
          echo APK_GITHUB_RELEASE_PUBLISHED
      - name: Upload bounded classifications only; never source, license or private logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaris-codespace-apk-report-${{ github.run_id }}
          path: |
            apk-evidence/preflight-safe.txt
            apk-evidence/build-status-safe.txt
            apk-evidence/release-result.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Tell owner build or preflight result on Issue 77
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo '**AARIS CODESPACE ANDROID APK**'
            echo "Mode: \`$OPERATION\` | Workflow outcome: \`$CHECK_RESULT\`"
            echo '~~~text'
            if test -s apk-evidence/preflight-safe.txt; then
              cat apk-evidence/preflight-safe.txt
            else
              echo 'APK_PREFLIGHT_NO_REPORT'
            fi
            if test -s apk-evidence/build-status-safe.txt; then
              cat apk-evidence/build-status-safe.txt
            fi
            if test -s apk-evidence/release-result.txt; then
              cat apk-evidence/release-result.txt
            fi
            echo '~~~'
            printf '[Build or diagnostic run](https://github.com/%s/actions/runs/%s)\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > apk-evidence/owner-reply.md
          gh issue comment 77 -R "$GITHUB_REPOSITORY" -F apk-evidence/owner-reply.md
