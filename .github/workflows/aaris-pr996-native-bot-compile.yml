name: Temporary PR 996 native bot source compilation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/aaris-pr996-native-bot-compile.yml'
      - 'Assets/AarisWorld/Scripts/AarisOfflineBRDirector.cs'
      - 'Tools/Validation/test_offline_rival_distance_budget.py'
permissions:
  contents: read
jobs:
  native-candidate-only:
    if: >-
      github.event.pull_request.number == 996 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'sundamunda289-art' &&
      github.event.pull_request.head.ref == 'ai-bot-virtual-render-split-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile exact PR C# in isolated Codespace /tmp project
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'CANDIDATE_NATIVE_TOKEN_UNAVAILABLE'; exit 20; }
          MACHINE=aaris-ai-ubuntu-minimal-gxpgxwqvv9rq29x46
          gh codespace list --limit 100 --json name,state,repository > "$RUNNER_TEMP/candidate-machines.json"
          jq -e --arg m "$MACHINE" '
            [.[] | select(.name == $m and .state == "Available" and
              ((.repository // "") | endswith("/Unity-Game-Aris")))] | length == 1
          ' "$RUNNER_TEMP/candidate-machines.json" >/dev/null || {
            echo 'CANDIDATE_NATIVE_MACHINE_NOT_AVAILABLE'; exit 21;
          }
          python3 - <<'PY'
          import os
          from pathlib import Path
          base = Path('Tools/Codespaces/native_source_compile_sandbox.sh').read_text()
          anchor = 'cp "$SOURCE/ProjectSettings/ProjectVersion.txt" "$WORK/project/ProjectSettings/ProjectVersion.txt"'
          assert base.count(anchor) == 1
          commit = os.environ['PR_HEAD_SHA']
          assert len(commit) == 40 and all(c in '0123456789abcdef' for c in commit)
          replacement = (
              '# Candidate ONLY: override one C# file in disposable /tmp project.\n'
              'curl -fsSL --retry 2 --connect-timeout 10 --max-time 60 '
              '"https://raw.githubusercontent.com/sundamunda289-art/Unity-Game-Aris/'
              + commit + '/Assets/AarisWorld/Scripts/AarisOfflineBRDirector.cs" '
              '-o "$WORK/project/Assets/AarisWorld/Scripts/AarisOfflineBRDirector.cs"\n'
              '[[ "$(git hash-object -- "$WORK/project/Assets/AarisWorld/Scripts/AarisOfflineBRDirector.cs")" '
              '== "957947aa96e48f0936ff56d56d72d81b257dc607" ]] || { echo AARIS_NATIVE_CANDIDATE_HASH_MISMATCH; exit 32; }\n'
              'echo AARIS_NATIVE_CANDIDATE_SHA_VERIFIED=yes\n'
              + anchor
          )
          Path('/tmp/aaris-pr996-native.sh').write_text(base.replace(anchor,replacement))
          PY
          timeout --kill-after=12s 610s gh codespace ssh -c "$MACHINE" -- 'bash -s' \
            < /tmp/aaris-pr996-native.sh > "$RUNNER_TEMP/native-result.txt"
          grep -qx 'AARIS_NATIVE_CANDIDATE_SHA_VERIFIED=yes' "$RUNNER_TEMP/native-result.txt"
          grep -qx 'AARIS_NATIVE_COMPILE_CSHARP_ERRORS=0' "$RUNNER_TEMP/native-result.txt"
          grep -qx 'AARIS_NATIVE_COMPILE_METHOD_RAN=yes' "$RUNNER_TEMP/native-result.txt"
          grep -qx 'AARIS_NATIVE_COMPILE_RESULT=source_only_pass' "$RUNNER_TEMP/native-result.txt"
          grep '^AARIS_NATIVE_' "$RUNNER_TEMP/native-result.txt" | tail -20
          echo CANDIDATE_NATIVE_UNITY_CSHARP_PASS
