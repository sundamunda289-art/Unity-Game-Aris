name: Read-only world context audit
on:
  pull_request:
    paths:
      - 'Tools/World/**'
      - '.github/workflows/world-context-audit.yml'
      - 'Assets/TerrainDemoScene_URP/**'
      - 'Assets/WorldImports/**'
      - 'AGENTS.md'
      - 'Docs/WORLD_AUTOMATION.md'
  push:
    branches: [main]
    paths:
      - 'Tools/World/**'
      - 'Assets/TerrainDemoScene_URP/**'
      - 'Assets/WorldImports/**'
permissions:
  contents: read
jobs:
  inspect-random-places:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r Tools/World/requirements.txt
      - name: Fetch current native terrain and referenced scene geometry
        env:
          WORLD_REQUEST: '{"command":"inspect","x":0,"y":0,"z":0,"native":true,"geometry":true}'
        run: python Tools/World/fetch_assets.py
      - name: Diagnose residential meshes from hydrated Git LFS (read-only)
        run: python Tools/World/diagnose_house_geometry.py
      - name: Diagnose bungalow vs neighbouring house submesh triangles (read-only)
        run: python Tools/World/diagnose_suspicious_house_faces.py
      - name: Check a complete straight-sweep vehicle envelope across all 45 spawn-to-road routes
        run: python Tools/World/vehicle_swept_clearance.py
      - name: Simulate all 45 vehicle reservations and scan actual native rock/tree centers near 47 enlarged homes
        run: python Tools/World/smart_residential_clearance.py --native
      - name: Inspect seeded random points and preview move and color edits in temporary copies
        run: python Tools/World/audit_context.py


      - name: Smoke-test real saved scene relative move without writing
        run: |
          python Tools/World/ai_world_motion.py plan --root . \
            --target 'scene:9a18cc5d35536fd428eb6e90b3402589:10242' \
            --direction left --metres 50 --frame world \
            --limit 2 --no-neighbours --validate-plan
