name: Aaris Live Unity Desktop via Cloudflare (Email PIN)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aaris-live-unity.yml'
      - 'Tools/CI/live_camera_server.py'
      - 'Tools/CI/issue_camera_bridge.py'
      - 'Tools/CI/ai_intents.py'
      - 'Tools/CI/unity_personal_bootstrap.py'
      - 'Tools/CI/license_reuse.py'
      - 'Tools/CI/runner_storage.sh'
      - 'Assets/AarisWorld/Editor/AarisLiveCameraBridge.cs'
      - 'Assets/AarisWorld/Editor/AarisLiveCameraBridge.cs.meta'
      - 'Assets/AarisWorld/Editor/AarisAIControlBridge.cs'
      - 'Assets/AarisWorld/Editor/AarisAIControlBridge.cs.meta'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aaris-live-unity.yml'
      - 'Tools/CI/**'
      - 'Assets/AarisWorld/Editor/**'
      - 'AGENTS.md'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Temporary live desktop time (minutes)'
        type: choice
        required: true
        default: '45'
        options: ['15', '45', '90', '240', '300']
      license_export_recipient:
        description: 'Optional age1 public key for encrypted license artifact (NO private key)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: aaris-one-live-editor-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'issue_comment' || (github.event.issue.number == 77 && github.event.comment.user.login == 'sundamunda289-art' && (startsWith(github.event.comment.body, 'START_DESKTOP ') || startsWith(github.event.comment.body, 'ACTIVATE_UNITY ')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Verify camera API rejects unsafe inputs
        run: |
          python3 -m py_compile Tools/CI/live_camera_server.py Tools/CI/issue_camera_bridge.py Tools/CI/ai_intents.py Tools/CI/unity_personal_bootstrap.py
          python3 Tools/CI/ai_intents.py
          bash -n Tools/CI/termux_secure_license_export.sh
          python3 Tools/CI/unity_personal_bootstrap.py --selftest
          python3 Tools/CI/license_reuse.py --selftest
          python3 Tools/CI/issue_camera_bridge.py --selftest
          node --check Tools/CI/cloudflare_live_hub.mjs
          python3 - <<'PY'
          import sys
          sys.path.insert(0,"Tools/CI")
          from live_camera_server import validate
          clean=validate({"x":-420,"y":22,"z":-210,"yaw":0,"pitch":20,"distance":22})
          assert clean["x"] == -420 and clean["distance"] == 22
          rejected=[
              {"x":9999,"y":22,"z":-210,"yaw":0,"pitch":20,"distance":22},
              {"x":0,"y":22,"z":0,"yaw":0,"pitch":0,"distance":22,"shell":"rm -rf /"},
              {"x":0,"y":float("nan"),"z":0,"yaw":0,"pitch":0,"distance":22},
          ]
          for entry in rejected:
              try: validate(entry)
              except ValueError: pass
              else: raise AssertionError("Unsafe camera request was accepted")
          print("Camera intents: bounded coordinates / no arbitrary commands PASS")
          PY

  live-desktop:
    permissions:
      contents: write
      issues: write
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 77 && github.event.comment.user.login == 'sundamunda289-art' && (startsWith(github.event.comment.body, 'START_DESKTOP ') || startsWith(github.event.comment.body, 'ACTIVATE_UNITY ')))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      SESSION_MINUTES: ${{ github.event_name == 'issue_comment' && github.event.comment.body || inputs.session_minutes || '15' }}
      GAMECI_IMAGE: unityci/editor:ubuntu-6000.3.26f1-base-3
      LICENSE_EXPORT_RECIPIENT: ${{ inputs.license_export_recipient || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - name: Resume persisted AI map edits from previous runner
        run: |
          set -euo pipefail
          git config user.name "Aaris Unity AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git ls-remote --exit-code --heads origin ai-map-edits >/dev/null 2>&1; then
            git fetch origin refs/heads/ai-map-edits:refs/remotes/origin/ai-map-edits
            git switch -c ai-map-edits --track origin/ai-map-edits
            # Integrate main updates without throwing away any prior map edits.
            # A conflict stops this session rather than silently resetting a scene.
            git merge --no-edit origin/main
            git push origin HEAD:refs/heads/ai-map-edits
            echo 'Restored durable AI edit branch from GitHub.'
          else
            git switch -c ai-map-edits
            echo 'Created a new AI edit branch from current main.'
          fi
      - name: Free cloud runner disk before Unity Docker / native map import
        run: |
          bash Tools/CI/runner_storage.sh selftest
          bash Tools/CI/runner_storage.sh cleanup
      - name: Restore safe Unity import cache (not authentication)
        uses: actions/cache@v4
        with:
          path: Library/
          key: aaris-unity-library-linux-6000.3.26f1-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            aaris-unity-library-linux-6000.3.26f1-
      - name: Verify approved email and session length
        run: |
          set -euo pipefail
          if [[ -z "$UNITY_EMAIL" ]]; then
            echo '::error::UNITY_EMAIL GitHub Secret must be set to the email allowed to view desktop.'
            exit 1
          fi
          # Github issue comments are untrusted text: never put this value in a shell command.
          # Only these exact three commands from the repository owner can start a runner.
          case "$SESSION_MINUTES" in
            "START_DESKTOP 15"|"START_DESKTOP 45"|"START_DESKTOP 90"|"START_DESKTOP 240"|"START_DESKTOP 300")
              SESSION_MINUTES="${SESSION_MINUTES#START_DESKTOP }" ;;
            "ACTIVATE_UNITY 15"|"ACTIVATE_UNITY 45"|"ACTIVATE_UNITY 90"|"ACTIVATE_UNITY 240"|"ACTIVATE_UNITY 300")
              SESSION_MINUTES="${SESSION_MINUTES#ACTIVATE_UNITY }" ;;
          esac
          case "$SESSION_MINUTES" in 15|45|90|240|300) ;; *)
            echo '::error::Invalid session length. Allowed: 15, 45, 90, 240, 300 minutes.'
            exit 1 ;;
          esac
          echo "SESSION_MINUTES=$SESSION_MINUTES" >> "$GITHUB_ENV"
          echo 'Cloudflare will require an email one-time PIN; URL alone is not enough.'
      - name: Install virtual screen, Web VNC and proxy
        timeout-minutes: 7
        run: |
          set -euo pipefail
          # GitHub Ubuntu mirrors occasionally stall; a 90s mandatory metadata
          # refresh previously killed this step (exit 124) before Xvfb started.
          # Retry briefly with bounded HTTP timeouts, then try cached indexes.
          if ! sudo timeout 45 apt-get update -qq \
              -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=12 \
              -o Acquire::https::Timeout=12; then
            echo '::warning::APT index update timed out; attempting install using existing metadata.'
          fi
          if ! sudo timeout 155 env DEBIAN_FRONTEND=noninteractive \
              apt-get install -y -qq --no-install-recommends \
              xvfb x11vnc novnc websockify nginx openbox git-lfs \
              libgl1-mesa-dri libglu1-mesa age; then
            echo '::error::Required noVNC/Unity desktop packages unavailable. Check runner APT mirrors.'
            exit 1
          fi
          for binary in Xvfb x11vnc websockify nginx git; do
            command -v "$binary" >/dev/null || {
              echo "::error::Missing required desktop command: $binary"; exit 1;
            }
          done
          # Optional diagnostic screenshots must never prevent Unity from booting.
          if ! sudo timeout 60 env DEBIAN_FRONTEND=noninteractive \
              apt-get install -y -qq --no-install-recommends scrot; then
            echo '::warning::Optional scrot missing; protected /api/desktop.png will return 503.'
          fi
          git lfs install --local
          mkdir -p ci-live-control ci-logs ci-photos
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac > /tmp/aaris-xvfb.log 2>&1 &
          echo "$!" > /tmp/aaris-xvfb.pid
          sleep 2
          DISPLAY=:99 openbox > /tmp/aaris-openbox.log 2>&1 &
          DISPLAY=:99 x11vnc -display :99 -rfbport 5900 -localhost -forever \
            -shared -nopw -noxdamage -quiet > /tmp/aaris-x11vnc.log 2>&1 &
          websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900 \
            > /tmp/aaris-websockify.log 2>&1 &
          python3 Tools/CI/live_camera_server.py > /tmp/aaris-api.log 2>&1 &
          echo "$!" > /tmp/aaris-api.pid
          cat >/tmp/aaris-nginx.conf <<'CONF'
          worker_processes 1;
          pid /tmp/aaris-nginx.pid;
          events { worker_connections 256; }
          http {
            access_log off;
            server {
              listen 127.0.0.1:8080;
              location /vnc/ {
                proxy_pass http://127.0.0.1:6080/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 3600s;
              }
              location / {
                proxy_pass http://127.0.0.1:8765;
              }
            }
          }
          CONF
          sudo nginx -c /tmp/aaris-nginx.conf
          curl --retry 8 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:8080/api/status
          curl --retry 8 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:8080/vnc/vnc.html -o /dev/null

          python3 - <<'PY'
          import base64, os, socket, time
          ok=False
          for attempt in range(15):
              try:
                  with socket.create_connection(("127.0.0.1",8080), timeout=3) as s:
                      key=base64.b64encode(os.urandom(16)).decode()
                      request=(f"GET /vnc/websockify HTTP/1.1\r\n"
                               "Host: 127.0.0.1:8080\r\n"
                               "Connection: Upgrade\r\nUpgrade: websocket\r\n"
                               "Sec-WebSocket-Version: 13\r\n"
                               f"Sec-WebSocket-Key: {key}\r\n\r\n")
                      s.sendall(request.encode())
                      response=s.recv(1024)
                      if b" 101 " in response:
                          ok=True
                          break
              except OSError:
                  pass
              time.sleep(1)
          if not ok:
              raise SystemExit("noVNC WebSocket handshake through nginx failed")
          print("noVNC WebSocket handshake passed")
          PY
      - name: Start Cloudflare email-protected temporary tunnel
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/aaris-cloudflared
          chmod +x /tmp/aaris-cloudflared
          /tmp/aaris-cloudflared tunnel --url http://127.0.0.1:8080 \
            --allowed-mail "$UNITY_EMAIL" > /tmp/aaris-tunnel.log 2>&1 &
          echo "$!" > /tmp/aaris-tunnel.pid
          url=""
          for i in {1..40}; do
            url=$(grep -Eom1 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/aaris-tunnel.log || true)
            if [[ -n "$url" ]]; then break; fi
            if ! kill -0 "$(cat /tmp/aaris-tunnel.pid)" 2>/dev/null; then
              echo '::error::Cloudflare process exited before producing a secure URL.'
              tail -n 50 /tmp/aaris-tunnel.log
              exit 1
            fi
            sleep 2
          done
          test -n "$url"
          printf '%s\n' "$url" > /tmp/aaris-tunnel-url
          echo "::notice title=Aaris live Unity desktop::$url (email one-time PIN required)"
          echo "## Live editor session" >> "$GITHUB_STEP_SUMMARY"
          echo "Open: $url" >> "$GITHUB_STEP_SUMMARY"
          echo 'Cloudflare PIN is sent to the email stored in UNITY_EMAIL.' >> "$GITHUB_STEP_SUMMARY"
          echo "Session length: $SESSION_MINUTES minutes" >> "$GITHUB_STEP_SUMMARY"
      - name: Start owner-authorized issue camera bridge
        run: |
          mkdir -p ci-logs ci-live-control
          (python3 Tools/CI/issue_camera_bridge.py --seconds "$((SESSION_MINUTES*60))" \
            > ci-logs/issue-camera-relay.log 2>&1) &
          echo "$!" > /tmp/aaris-issue-bridge.pid
          echo 'Camera commands: https://github.com/sundamunda289-art/Unity-Game-Aris/issues/77'
          echo 'Only owner-issued CAMERA x y z yaw pitch distance commands are accepted.'
      - name: Start real Unity Editor with authorized ULF or Unity CLI Personal sign-in
        continue-on-error: true
        timeout-minutes: 35
        run: |
          set -euo pipefail
          printf '{"state":"fetching_unity_editor","detail":"Preparing pinned Editor and native scene."}\n' > ci-live-control/license-status.json
          git lfs pull --include="Assets/**" --exclude=""
          if head -c 80 Assets/TerrainDemoScene_URP/Scenes/TerrainDemoScene.unity |
            grep -q 'git-lfs.github.com/spec'; then
            echo '::error::Native Unity scene is still a Git LFS pointer.'
            exit 1
          fi
          # Unity Editor image is a convenience, not a fake render.
          # Docker pull time on fresh hosted runners cannot be guaranteed.
          docker pull "$GAMECI_IMAGE"
          export AARIS_HOST_UID="$(id -u)" AARIS_HOST_GID="$(id -g)"
          docker run --detach --name aaris-unity-live --shm-size=1g \
            --env AARIS_HOST_UID --env AARIS_HOST_GID \
            --env UNITY_LICENSE --env DISPLAY=:99 \
            --env LIBGL_ALWAYS_SOFTWARE=1 --env GALLIUM_DRIVER=llvmpipe \
            --volume /tmp/.X11-unix:/tmp/.X11-unix \
            --volume "$PWD:/project" --workdir /project \
            "$GAMECI_IMAGE" bash -lc '
              mkdir -p /project/ci-logs
              # Keep this container alive after an activation failure so an
              # explicit ACTIVATE_UNITY issue command can retry in the same VM.
              flock -n /tmp/aaris-unity-bootstrap.lock \
                python3 Tools/CI/unity_personal_bootstrap.py \
                > /project/ci-logs/unity-initial-activation.log 2>&1 || true
              exec tail -f /dev/null
            '
          echo 'Unity license bootstrap started inside the same container as the real Editor.'
          echo 'Sign-in links, if necessary, are shown only on the Cloudflare email-PIN gated control page.'
          echo 'Neither an email/password Secret nor a Unity service-account Secret bypasses user licensing.'
      - name: Watch for one-time private Unity ULF export
        run: |
          mkdir -p ci-logs ci-live-control
          (python3 Tools/CI/license_reuse.py --watch-seconds "$((SESSION_MINUTES*60))" \
            > ci-logs/license-reuse.log 2>&1) &
          echo "$!" > /tmp/aaris-license-watch.pid
      - name: Check Unity bootstrap health (no private OAuth values)
        if: always()
        run: |
          # The Docker container can start even if the CLI later rejects the
          # license. Surface only the controlled state string, never auth_url.
          sleep 4
          if [[ -f ci-live-control/license-status.json ]]; then
            state="$(python3 - <<'PY'
          import json
          try:
              obj=json.load(open('ci-live-control/license-status.json'))
              state=str(obj.get('state','unknown'))
              print(state if state.replace('_','').isalnum() else 'unknown')
          except (OSError,ValueError):
              print('unreadable_status')
          PY
          )"
          else
            state='bootstrap_not_started'
          fi
          echo "Unity bootstrap state: $state"
          echo "Unity bootstrap: $state" >> "$GITHUB_STEP_SUMMARY"
          if docker inspect -f '{{.State.Running}}' aaris-unity-live 2>/dev/null | grep -qx false; then
            echo '::warning::Unity container exited. Check the secure browser license status and correct the activation prerequisite.'
          fi
      - name: Export authorized Unity license as phone-encrypted artifact
        if: github.event_name == 'workflow_dispatch' && inputs.license_export_recipient != ''
        # A first-time Unity Hub GUI login can take longer than the old 12m poll.
        timeout-minutes: 43
        run: |
          set -euo pipefail
          # Only an age public key can enter; private keys never reach GitHub.
          if [[ ! "$LICENSE_EXPORT_RECIPIENT" =~ ^age1[a-z0-9]{55,85}$ ]]; then
            echo '::error::Invalid age public recipient (expected age1...).'
            exit 1
          fi
          mkdir -p ci-license-encrypted
          echo 'Looking for a legitimate Unity ULF; will encrypt only if it exists.'
          for ((i=0;i<480;i++)); do
            if [[ -s ci-live-control/Unity_lic.ulf ]]; then
              python3 - <<'PY'
          import sys
          sys.path.insert(0,'Tools/CI')
          from pathlib import Path
          from license_reuse import check_license
          check_license(Path('ci-live-control/Unity_lic.ulf').read_bytes())
          print('Authorized Unity ULF XML format validated.')
          PY
              age -r "$LICENSE_EXPORT_RECIPIENT" \
                -o ci-license-encrypted/Unity_lic.ulf.age \
                ci-live-control/Unity_lic.ulf
              test -s ci-license-encrypted/Unity_lic.ulf.age
              echo 'Encrypted Unity license ready; no plaintext uploaded.'
              exit 0
            fi
            sleep 5
          done
          # A missing artifact must never result in a green "license export".
          # Show only controlled status names; NEVER dump OAuth URLs, license
          # contents, or raw Unity logs into public Actions output.
          safe_state="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('ci-live-control/license-status.json')
          try:
              v=json.loads(p.read_text()).get('state','unknown')
              print(v if isinstance(v,str) and v.replace('_','').isalnum() else 'unknown')
          except (OSError,ValueError,TypeError):
              print('unavailable')
          PY
          )"
          echo "::error::No reusable Unity ULF was generated (Unity bootstrap state: $safe_state). No encrypted license artifact exists."
          echo '### Unity license export: FAILED' >> "$GITHUB_STEP_SUMMARY"
          echo "No .ulf file was created. Final safe state: $safe_state" >> "$GITHUB_STEP_SUMMARY"
          echo 'Unity Personal activation requires Unity Hub sign-in. CLI login alone does not establish a portable ULF.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Upload age-encrypted Unity license (private key stays on phone)
        if: github.event_name == 'workflow_dispatch' && inputs.license_export_recipient != ''
        uses: actions/upload-artifact@v4
        with:
          name: aaris-unity-license-encrypted
          path: ci-license-encrypted/Unity_lic.ulf.age
          if-no-files-found: warn
          retention-days: 1
      - name: Keep temporary desktop session online
        if: env.LICENSE_EXPORT_RECIPIENT == ''
        run: |
          echo "Cloudflare session is active for $SESSION_MINUTES minutes."
          sleep "$((SESSION_MINUTES*60))"
      - name: Upload AI reports, blueprints and target snapshots (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaris-ai-scene-reports
          path: |
            ci-live-control/ai-result-*.json
            ci-live-control/ai-blueprint-*.svg
            ci-live-control/ai-photo-*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload last available Unity camera photo only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaris-live-camera-last-photo
          path: ci-live-control/latest.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Collect scrubbed stage and desktop diagnostics
        if: always()
        run: |
          # This is safe to upload: fixed enums and booleans only.
          # NEVER store VNC screenshots, Unity sign-in URLs, Hub logs or ULFs.
          mkdir -p ci-live-control
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          try:
              sys.path.insert(0, "Tools/CI")
              from live_camera_server import public_diagnostics
              result = public_diagnostics()
          except Exception:
              result = {"license_phase": "diagnostics_unavailable",
                        "next_action": "Inspect the failed GitHub Actions step"}
          Path("ci-live-control/runner-diagnostics.json").write_text(
              json.dumps(result, sort_keys=True, indent=2))
          print("Runner diagnostics collected; private Unity secrets excluded.")
          PY
      - name: Upload sanitized runner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaris-runner-diagnostics
          path: ci-live-control/runner-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop temporary Unity session
        if: always()
        run: |
          docker rm -f aaris-unity-live >/dev/null 2>&1 || true
          if [[ -f /tmp/aaris-tunnel.pid ]]; then
            kill "$(cat /tmp/aaris-tunnel.pid)" 2>/dev/null || true
          fi
          if [[ -f /tmp/aaris-issue-bridge.pid ]]; then
            kill "$(cat /tmp/aaris-issue-bridge.pid)" 2>/dev/null || true
          fi
          if [[ -f /tmp/aaris-license-watch.pid ]]; then
            kill "$(cat /tmp/aaris-license-watch.pid)" 2>/dev/null || true
          fi
          echo 'Session ended. GitHub source and Releases remain; runner desktop is ephemeral.'
