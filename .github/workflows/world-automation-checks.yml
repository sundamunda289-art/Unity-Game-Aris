name: World automation checks
on:
  pull_request:
    paths:
      - 'Tools/World/**'
      - 'Assets/AarisWorld/Editor/World*.cs*'
      - 'Assets/AarisWorld/Editor/AarisResidentialRoutePhysicsAudit.cs*'
      - '.github/workflows/world-*.yml'
      - 'AGENTS.md'
      - 'Docs/WORLD_AUTOMATION.md'
  push:
    branches: [main]
    paths:
      - 'Tools/World/**'
      - 'Assets/AarisWorld/Editor/World*.cs*'
      - '.github/workflows/world-*.yml'
permissions:
  contents: read
jobs:
  saved-core-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r Tools/World/requirements.txt tree-sitter==0.26.0 tree-sitter-c-sharp==0.23.5
      - run: python -m unittest discover -s Tools/World/tests -v
      - run: python Tools/World/check_contracts.py
      - name: Verify Python-authored satellite mesh, scene copies and collider registry
        run: python Tools/World/check_satellite.py
      - run: python Tools/World/world.py --out "$RUNNER_TEMP/world-verify.json" verify
      - name: Fetch actual four native terrains for reader integration test
        env:
          WORLD_REQUEST: '{"command":"verify","native":true}'
        run: python Tools/World/fetch_assets.py
      - name: Decode actual LFS binary assets and verify seams without writing source
        run: python Tools/World/native_smoke.py
      - name: Fetch neighbourhood geometry for complete source bounds
        env:
          WORLD_REQUEST: '{"command":"inspect","x":662,"y":23.734358786547034,"z":-650,"native":true,"geometry":true}'
        run: python Tools/World/fetch_assets.py
      - name: Query AI site capsule on actual native terrain and saved scene
        run: |
          python Tools/World/world.py --out "$RUNNER_TEMP/world-site.json" site --x 662 --z -650 --radius 35 --limit 30
          python -c 'import json, os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"world-site.json").read_text()); s=d["result"]["site"]; assert d["command"]=="site"; assert s["radius_m"]==35; assert s["coverage"]["free_space_verified_by_physics"] is False; assert "counts_by_category_in_full_radius" in s["native"]'
          rm -f -- "$RUNNER_TEMP/world-site.json"
      - name: Check saved satellites against native terrain and current neighbours
        run: python Tools/World/check_satellite.py --native
      - name: Remove temporary verification report
        if: always()
        run: rm -f -- "$RUNNER_TEMP/world-verify.json"
