name: Aaris Mobile Gameplay and Hotpath Regression

on:
  pull_request:
    paths:
      - 'Assets/AarisWorld/Scripts/**'
      - 'Assets/Resources/AarisVehicles/Authored/AarisRoadBike*'
      - 'Tools/Art/generate_road_bike.py'
      - 'Tools/Validation/test_roadside_bike_visuals.py'
      - 'Assets/AarisWorld/Player/AarisPlayer.prefab'
      - 'Assets/Resources/AarisCharacters/Primary/**'
      - 'Packages/manifest.json'
      - 'Tools/Validation/check_battle_hud.py'
      - 'Tools/Validation/check_battle_hardening.py'
      - 'Tools/Validation/test_android_medical_pool_low_memory.py'
      - 'Tools/Validation/check_mobile_hotpaths.py'
      - 'Tools/Validation/*physics_hit_buffer*'
      - 'Tools/Validation/PhysicsHitBufferTests.cs'
      - 'Tools/Validation/*runtime_native_work*'
      - 'Tools/Validation/RuntimeNativeWorkTests.cs'
      - 'Tools/Validation/*streaming_admission*'
      - 'Tools/Validation/StreamingAdmissionTests.cs'
      - 'Tools/Validation/*idle_audio_animation*'
      - 'Tools/Validation/IdleAudioAnimationTests.cs'
      - 'Tools/Validation/check_android_hotloop_blocking_calls.py'
      - 'Tools/Validation/test_android_hotloop_blocking_calls.py'
      - 'Tools/Validation/test_android_shared_streaming_frame_gate.py'
      - 'Tools/Validation/test_offline_rival_distance_budget.py'
      - 'Tools/Validation/test_android_runtime_diagnostics_analysis.py'
      - 'Tools/Validation/test_android_plane_async_boot.py'
      - 'Tools/Validation/test_android_collider_release_burst.py'
      - 'Tools/Validation/test_android_predictive_vehicle_prewarm.py'
      - 'Tools/Validation/test_android_canopy_rope_native_budget.py'
      - 'Tools/Validation/test_android_plane_finish_async_stage.py'
      - 'Tools/Validation/test_gloo_preview_pose_budget.py'
      - 'Tools/Validation/test_loot_visibility_pacing.py'
      - 'Tools/Validation/test_loot_pickup_one_time_native_cost.py'
      - 'Tools/Validation/test_open_combat_houses.py'
      - 'Tools/Validation/test_house_facade_details.py'
      - 'Tools/Validation/test_house_facade_lod_texture.py'
      - 'Tools/Validation/test_android_facade_frame_admission.py'
      - 'Tools/Validation/test_android_cross_system_hierarchy_budget.py'
      - 'Tools/Art/generate_limestone_trim.py'
      - 'Assets/Resources/AarisBuildings/ArchitecturalLimestone.png*'
      - 'Tools/Validation/test_player_streamer_lifecycle.py'
      - 'Tools/Validation/test_hud_pointer_orphan_recovery.py'
      - 'Tools/Validation/test_vehicle_hud_state_restoration.py'
      - 'Tools/Validation/test_vehicle_session_suspension.py'
      - 'Tools/Validation/test_vehicle_motor_disable_authority.py'
      - 'Tools/Validation/test_vehicle_surface_maps.py'
      - '.github/workflows/aaris-mobile-gameplay-regression.yml'
  push:
    branches: [main]
    paths:
      - 'Assets/AarisWorld/Scripts/**'
      - 'Assets/Resources/AarisVehicles/Authored/AarisRoadBike*'
      - 'Tools/Art/generate_road_bike.py'
      - 'Tools/Validation/test_roadside_bike_visuals.py'
      - 'Assets/AarisWorld/Player/AarisPlayer.prefab'
      - 'Assets/Resources/AarisCharacters/Primary/**'
      - 'Packages/manifest.json'
      - 'Tools/Validation/check_battle_hud.py'
      - 'Tools/Validation/check_battle_hardening.py'
      - 'Tools/Validation/test_android_medical_pool_low_memory.py'
      - 'Tools/Validation/check_mobile_hotpaths.py'
      - 'Tools/Validation/*physics_hit_buffer*'
      - 'Tools/Validation/PhysicsHitBufferTests.cs'
      - 'Tools/Validation/*runtime_native_work*'
      - 'Tools/Validation/RuntimeNativeWorkTests.cs'
      - 'Tools/Validation/*streaming_admission*'
      - 'Tools/Validation/StreamingAdmissionTests.cs'
      - 'Tools/Validation/*idle_audio_animation*'
      - 'Tools/Validation/IdleAudioAnimationTests.cs'
      - 'Tools/Validation/check_android_hotloop_blocking_calls.py'
      - 'Tools/Validation/test_android_hotloop_blocking_calls.py'
      - 'Tools/Validation/test_android_shared_streaming_frame_gate.py'
      - 'Tools/Validation/test_offline_rival_distance_budget.py'
      - 'Tools/Validation/test_android_runtime_diagnostics_analysis.py'
      - 'Tools/Validation/test_android_plane_async_boot.py'
      - 'Tools/Validation/test_android_collider_release_burst.py'
      - 'Tools/Validation/test_android_predictive_vehicle_prewarm.py'
      - 'Tools/Validation/test_android_canopy_rope_native_budget.py'
      - 'Tools/Validation/test_android_plane_finish_async_stage.py'
      - 'Tools/Validation/test_gloo_preview_pose_budget.py'
      - 'Tools/Validation/test_loot_visibility_pacing.py'
      - 'Tools/Validation/test_loot_pickup_one_time_native_cost.py'
      - 'Tools/Validation/test_open_combat_houses.py'
      - 'Tools/Validation/test_house_facade_details.py'
      - 'Tools/Validation/test_house_facade_lod_texture.py'
      - 'Tools/Validation/test_android_facade_frame_admission.py'
      - 'Tools/Validation/test_android_cross_system_hierarchy_budget.py'
      - 'Tools/Art/generate_limestone_trim.py'
      - 'Assets/Resources/AarisBuildings/ArchitecturalLimestone.png*'
      - 'Tools/Validation/test_player_streamer_lifecycle.py'
      - 'Tools/Validation/test_hud_pointer_orphan_recovery.py'
      - 'Tools/Validation/test_vehicle_hud_state_restoration.py'
      - 'Tools/Validation/test_vehicle_session_suspension.py'
      - 'Tools/Validation/test_vehicle_motor_disable_authority.py'
      - 'Tools/Validation/test_vehicle_surface_maps.py'
      - '.github/workflows/aaris-mobile-gameplay-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aaris-mobile-gameplay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  combat-and-mobile-hotpaths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install C# parser and GUID audit dependencies
        run: python -m pip install --disable-pip-version-check 'tree-sitter>=0.23,<0.26' tree-sitter-c-sharp 'PyYAML>=6,<7'
      - name: Verify fire input, player movement and tactical gameplay
        run: |
          set -euo pipefail
          python Tools/Validation/check_battle_hud.py
          python Tools/Validation/check_mobile_hotpaths.py
          python Tools/Validation/check_android_hotloop_blocking_calls.py
          python Tools/Validation/test_android_hotloop_blocking_calls.py
          python Tools/Validation/test_android_shared_streaming_frame_gate.py
          python Tools/Validation/test_offline_rival_distance_budget.py
          python Tools/Validation/test_android_plane_async_boot.py
          python Tools/Validation/test_android_collider_release_burst.py
          python Tools/Validation/test_android_predictive_vehicle_prewarm.py
          python Tools/Validation/test_android_canopy_rope_native_budget.py
          python Tools/Validation/test_android_canopy_prefab_prewarm.py
          python Tools/Validation/test_android_plane_finish_async_stage.py
          python Tools/Validation/test_gloo_preview_pose_budget.py
          python Tools/Validation/test_android_runtime_diagnostics_analysis.py
          python Tools/Validation/test_android_diagnostics_frame_pacing.py
          python Tools/Validation/test_android_logcat_triage.py
          python Tools/Validation/test_weapon_pause_input_authority.py
          python Tools/Validation/test_loot_visibility_pacing.py
          python Tools/Validation/test_loot_pickup_one_time_native_cost.py
          python Tools/Validation/test_audio_footstep_gait.py
          python Tools/Validation/test_jump_contact_transition.py
          python Tools/Validation/test_balanced_low_stance_ik.py
          python Tools/Validation/test_locked_slope_foot_support.py
          python Tools/Validation/test_native_stance_transition_capture.py
          python Tools/Validation/test_character_pose_and_curved_ice.py
          python Tools/Validation/check_battle_hardening.py
          python Tools/Validation/test_android_medical_pool_low_memory.py
          python Tools/Validation/test_open_combat_houses.py
          python Tools/Validation/test_house_facade_details.py
          python Tools/Validation/test_house_facade_lod_texture.py
          python Tools/Validation/test_android_facade_frame_admission.py
          python Tools/Validation/test_android_cross_system_hierarchy_budget.py
          python Tools/Validation/test_player_streamer_lifecycle.py
          python Tools/Validation/test_hud_pointer_orphan_recovery.py
          python Tools/Validation/test_vehicle_hud_state_restoration.py
          python Tools/Validation/test_vehicle_session_suspension.py
          python Tools/Validation/test_vehicle_motor_disable_authority.py
          python Tools/Validation/test_vehicle_surface_maps.py
          python Tools/Validation/test_roadside_bike_visuals.py
      - name: Exercise production runtime work policies without Unity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mono-mcs
          python Tools/Validation/run_physics_hit_buffer_csharp.py
          python Tools/Validation/test_physics_hit_buffer_integration.py
          python Tools/Validation/run_runtime_native_work_csharp.py
          python Tools/Validation/run_idle_audio_animation_csharp.py
          python Tools/Validation/run_streaming_admission_csharp.py
      - name: Parse every saved AarisWorld C# gameplay script
        run: |
          python - <<'PY'
          from pathlib import Path
          from tree_sitter import Language, Parser
          import tree_sitter_c_sharp

          parser = Parser(Language(tree_sitter_c_sharp.language()))
          sources = sorted(Path("Assets/AarisWorld/Scripts").rglob("*.cs"))
          assert sources, "Missing gameplay C# source files"
          broken = [str(path) for path in sources
                    if parser.parse(path.read_bytes()).root_node.has_error]
          assert not broken, "Invalid C# syntax: " + ", ".join(broken)
          print(f"C# source syntax passed: {len(sources)} scripts")
          print("Static regression only; native Unity compilation, Play Mode and device FPS require separate verification.")
          PY
