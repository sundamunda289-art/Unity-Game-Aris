permissions:
  contents: read

concurrency:
  group: aaris-mobile-gameplay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  combat-and-mobile-hotpaths:
    # Pin supported LTS rather than an evolving 'latest' runner. The
    # previous Ubuntu 26.04 Mono package download hit this job's 10-minute cap.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install C# parser and GUID audit dependencies
        run: python -m pip install --disable-pip-version-check 'tree-sitter>=0.23,<0.26' tree-sitter-c-sharp 'PyYAML>=6,<7'
      - name: Verify fire input, player movement and tactical gameplay
        run: |
          set -euo pipefail
          python Tools/Validation/check_battle_hud.py
          python Tools/Validation/check_mobile_hotpaths.py
          python Tools/Validation/check_android_hotloop_blocking_calls.py
          python Tools/Validation/test_android_hotloop_blocking_calls.py
          python Tools/Validation/test_android_shared_streaming_frame_gate.py
          python Tools/Validation/test_android_async_upload_governor.py
          python Tools/Validation/test_offline_rival_distance_budget.py
          python Tools/Validation/test_offline_rival_central_scheduler.py
          python Tools/Validation/test_offline_rival_visible_far_sleep.py
          python Tools/Validation/test_offline_rival_spatial_index.py
          python Tools/Validation/test_offline_rival_attacker_coarse_prefilter.py
          python Tools/Validation/test_offline_rival_camera_fail_closed.py
          python Tools/Validation/test_android_plane_async_boot.py
          python Tools/Validation/test_android_collider_release_burst.py
          python Tools/Validation/test_android_predictive_vehicle_prewarm.py
          python Tools/Validation/test_vehicle_streaming_priority.py
          python Tools/Validation/test_vehicle_adaptive_frame_pacing.py
          python Tools/Validation/test_android_refresh_pacing_precision.py
          python Tools/Validation/test_android_bike_retirement_frame.py
          python Tools/Validation/test_android_bike_low_memory_cleanup_fence.py
          python Tools/Validation/test_android_vehicle_retirement_frame.py
          python Tools/Validation/test_android_canopy_rope_native_budget.py
          python Tools/Validation/test_android_canopy_prefab_prewarm.py
          python Tools/Validation/test_android_plane_finish_async_stage.py
          python Tools/Validation/test_gloo_preview_pose_budget.py
          python Tools/Validation/test_android_runtime_diagnostics_analysis.py
          python Tools/Validation/test_android_diagnostics_frame_pacing.py
          python Tools/Validation/test_android_logcat_triage.py
          python Tools/Validation/test_weapon_pause_input_authority.py
          python Tools/Validation/test_loot_visibility_pacing.py
          python Tools/Validation/test_loot_pickup_one_time_native_cost.py
          python Tools/Validation/test_android_idle_loot_visual_reuse.py
          python Tools/Validation/test_audio_footstep_gait.py
          python Tools/Validation/test_jump_contact_transition.py
          python Tools/Validation/test_balanced_low_stance_ik.py
          python Tools/Validation/test_locked_slope_foot_support.py
          python Tools/Validation/test_native_stance_transition_capture.py
          python Tools/Validation/test_character_pose_and_curved_ice.py
          python Tools/Validation/check_battle_hardening.py
          python Tools/Validation/test_combat_camera_hud_ai.py
          python Tools/Validation/test_combat_visible_target_gate.py
          python Tools/Validation/test_android_medical_pool_low_memory.py
          python Tools/Validation/test_open_combat_houses.py
          python Tools/Validation/test_house_facade_details.py
          python Tools/Validation/test_house_facade_lod_texture.py
          python Tools/Validation/test_android_facade_frame_admission.py
          python Tools/Validation/test_android_cross_system_hierarchy_budget.py
          python Tools/Validation/test_player_streamer_lifecycle.py
          python Tools/Validation/test_hud_pointer_orphan_recovery.py
          python Tools/Validation/test_vehicle_hud_state_restoration.py
          python Tools/Validation/test_vehicle_session_suspension.py
          python Tools/Validation/test_vehicle_motor_disable_authority.py
          python Tools/Validation/test_vehicle_surface_maps.py
          python Tools/Validation/test_roadside_bike_visuals.py
      - name: Exercise production runtime work policies without Unity
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends mono-mcs
          python Tools/Validation/run_physics_hit_buffer_csharp.py
          python Tools/Validation/test_physics_hit_buffer_integration.py
          python Tools/Validation/run_runtime_native_work_csharp.py
          python Tools/Validation/run_idle_audio_animation_csharp.py
          python Tools/Validation/run_streaming_admission_csharp.py
          python Tools/Validation/test_android_loot_visual_rebind_csharp.py
          python Tools/Validation/test_mobile_asset_lifecycle_budget.py
      - name: Parse every saved AarisWorld C# gameplay script
        run: |
          python - <<'PY'
          from pathlib import Path
          from tree_sitter import Language, Parser
          import tree_sitter_c_sharp

          parser = Parser(Language(tree_sitter_c_sharp.language()))
          sources = sorted(Path("Assets/AarisWorld/Scripts").rglob("*.cs"))
          assert sources, "Missing gameplay C# source files"
          broken = [str(path) for path in sources
                    if parser.parse(path.read_bytes()).root_node.has_error]
          assert not broken, "Invalid C# syntax: " + ", ".join(broken)
          print(f"C# source syntax passed: {len(sources)} scripts")
          print("Static regression only; native Unity compilation, Play Mode and device FPS require separate verification.")
          PY

  ai-virtualization-native-compile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feature/ai-near-offscreen-render-cull-20261124' || github.head_ref == 'feature/ai-offscreen-gunfire-vfx-20261124')
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Archive complete PR CSharp source without LFS
        shell: bash
        run: |
          set -euo pipefail
          find Assets -type f \( -name '*.cs' -o -name '*.asmdef' -o -name '*.asmref' -o -name '*.rsp' \) -print0 > "$RUNNER_TEMP/ai-native-source-list"
          tar --null -czf "$RUNNER_TEMP/ai-native-sources.tar.gz" -T "$RUNNER_TEMP/ai-native-source-list" \
            Packages/manifest.json ProjectSettings/ProjectVersion.txt
          test -s "$RUNNER_TEMP/ai-native-sources.tar.gz"
      - name: Native Unity compile on isolated Codespace temporary project
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo AARIS_AI_NATIVE_GATE=missing_codespace_token; exit 31; }
          stage="/tmp/aaris-ai-native-source-$GITHUB_RUN_ID"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          gh codespace list --json name,state,repository --limit 100 > "$RUNNER_TEMP/ai-codespaces.json"
          machine="$(jq -r '[.[] | select(.state == "Available" and ((.repository // "") | endswith("/Unity-Game-Aris"))) | .name] | sort | .[0] // empty' "$RUNNER_TEMP/ai-codespaces.json")"
          [[ "$machine" =~ ^aaris-ai-[a-zA-Z0-9-]{3,110}$ ]] || {
            echo AARIS_AI_NATIVE_GATE=no_available_matching_codespace
            exit 32
          }
          cleanup() {
            gh codespace ssh -c "$machine" -- "rm -rf -- '$stage'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          gh codespace ssh -c "$machine" -- "mkdir -p '$stage/.git'"
          gh codespace ssh -c "$machine" -- "tar -xz -C '$stage'" < "$RUNNER_TEMP/ai-native-sources.tar.gz"
          sed "s|^SOURCE=/workspaces/Unity-Game-Aris$|SOURCE=$stage|" \
            Tools/Codespaces/native_source_compile_sandbox.sh > "$RUNNER_TEMP/ai-native-command.sh"
          rc=0
          gh codespace ssh -c "$machine" -- "bash -s" \
            < "$RUNNER_TEMP/ai-native-command.sh" \
            > "$RUNNER_TEMP/ai-native-result.txt" \
            2> "$RUNNER_TEMP/ai-native-stderr.private" || rc=$?
          grep -E '^AARIS_NATIVE_COMPILE_[A-Z0-9_]+=[a-zA-Z0-9_-]+$' \
            "$RUNNER_TEMP/ai-native-result.txt" | head -60 || true
          [[ "$rc" -eq 0 ]] &&
          grep -qx 'AARIS_NATIVE_COMPILE_CSHARP_ERRORS=0' "$RUNNER_TEMP/ai-native-result.txt" &&
          grep -qx 'AARIS_NATIVE_COMPILE_RESULT=source_only_pass' "$RUNNER_TEMP/ai-native-result.txt" || {
            echo AARIS_AI_NATIVE_GATE=source_compile_unverified
            exit 33
          }
          echo AARIS_AI_NATIVE_GATE=source_only_pass
