name: Aaris AI World - Worker contract checks

on:
  pull_request:
    paths:
      - 'Tools/World/ai_world_worker.py'
      - 'Tools/World/tests/test_ai_world_worker.py'
      - '.github/workflows/ai-world-worker-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and validate read-only worker contract
        run: |
          python -m py_compile Tools/World/ai_world_worker.py
          python -m unittest discover -s Tools/World/tests -p 'test_ai_world_worker.py' -v
