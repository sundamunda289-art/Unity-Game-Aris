name: Aaris survey progress (read-only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: aaris-survey-readonly-monitor
  cancel-in-progress: false
jobs:
  survey-progress:
    if: >-
      github.event.issue.number == 77 &&
      github.event.comment.user.login == 'sundamunda289-art' &&
      github.event.comment.body == 'SURVEY PULSE'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing Codespace without stopping Unity
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
        run: |
          set -euo pipefail
          mkdir -p survey-progress
          if test -z "${GH_TOKEN:-}"; then
            echo 'CODESPACE_PAT_NOT_CONFIGURED' > survey-progress/status.txt
            exit 1
          fi
          # Match Tools/Codespaces/controller.sh's exact preference order.
          # Otherwise the monitor can incorrectly report 0 frames from another machine.
          LIST="$(gh codespace list -R "$GITHUB_REPOSITORY" --json name,displayName,state --limit 30)"
          PINNED="aaris-ai-unity-ssh-vp5g97jv4r4gfpjgq"
          if jq -e --arg machine "$PINNED" 'any(.[]; .name == $machine)' <<< "$LIST" >/dev/null; then
            CODESPACE="$PINNED"
          else
            MINIMAL_COUNT="$(jq '[.[] | select(.displayName=="aaris-ai-ubuntu-minimal")] | length' <<< "$LIST")"
            if [[ "$MINIMAL_COUNT" -eq 1 ]]; then
              CODESPACE="$(jq -r '.[] | select(.displayName=="aaris-ai-ubuntu-minimal") | .name' <<< "$LIST")"
            elif [[ "$MINIMAL_COUNT" -gt 1 ]]; then
              CODESPACE=""
            else
              SSH_COUNT="$(jq '[.[] | select(.displayName=="aaris-ai-unity-ssh")] | length' <<< "$LIST")"
              if [[ "$SSH_COUNT" -eq 1 ]]; then
                CODESPACE="$(jq -r '.[] | select(.displayName=="aaris-ai-unity-ssh") | .name' <<< "$LIST")"
              else
                CODESPACE=""
              fi
            fi
          fi
          [[ "$CODESPACE" =~ ^[a-zA-Z0-9-]+$ ]] || {
            echo 'SELECTED_CODESPACE_MISSING_OR_AMBIGUOUS' > survey-progress/status.txt
            exit 1
          }
          echo "AARIS_SURVEY_MACHINE=$CODESPACE" >> "$GITHUB_ENV"
          if ! timeout 100 gh codespace ssh -c "$CODESPACE" -- 'bash -s' < Tools/Codespaces/survey_readonly_status.sh > survey-progress/status.txt 2>/dev/null; then
            echo 'SURVEY_DIAG_SSH_FAILED' > survey-progress/status.txt
            exit 1
          fi
          grep -q '^AARIS_SURVEY_READ_ONLY_DIAG$' survey-progress/status.txt
      - name: Export first six frames when all six exist
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
        run: |
          set -euo pipefail
          if grep -qx 'first_six_ready=yes' survey-progress/status.txt; then
            # Reuse the same machine as the diagnostic; never export stale frames.
            CS="${AARIS_SURVEY_MACHINE:-}"
            [[ "$CS" =~ ^[a-zA-Z0-9-]+$ ]] || exit 31
            if ! timeout 200 gh codespace ssh -c "$CS" -- 'bash -s' < Tools/Codespaces/survey_export_first_six.sh > /tmp/aaris-first-six.b64 2>/dev/null; then
              echo 'PREVIEW_TRANSFER_FAILED' >> survey-progress/status.txt
              exit 32
            fi
            if ! base64 --decode /tmp/aaris-first-six.b64 > survey-progress/survey-first-six-preview.png; then
              echo 'PREVIEW_DECODE_FAILED' >> survey-progress/status.txt
              exit 33
            fi
            rm -f /tmp/aaris-first-six.b64
            python3 -c "from pathlib import Path; p=Path('survey-progress/survey-first-six-preview.png'); assert p.stat().st_size>8192; assert p.read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10])"
            echo 'PREVIEW_SIX_NATIVE_FRAMES_AVAILABLE' >> survey-progress/status.txt
          else
            echo 'PREVIEW_PENDING_SIX_NATIVE_FRAMES' >> survey-progress/status.txt
          fi
      - name: Upload sanitized survey progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaris-survey-progress-${{ github.run_id }}
          path: |
            survey-progress/status.txt
            survey-progress/survey-first-six-preview.png
          retention-days: 2
      - name: Reply with diagnostic to owner issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '**AARIS SURVEY READ-ONLY DIAGNOSTIC**'
            echo '~~~text'
            if test -f survey-progress/status.txt; then cat survey-progress/status.txt; else echo 'STATUS_UNAVAILABLE'; fi
            echo '~~~'
            printf '[Survey monitor run](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > /tmp/survey-issue-response.md
          gh issue comment 77 -R "$GITHUB_REPOSITORY" -F /tmp/survey-issue-response.md
