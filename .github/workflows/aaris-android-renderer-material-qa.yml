name: Android vehicle renderer material validation QA

on:
  pull_request:
    paths:
      - 'Assets/AarisWorld/Scripts/AarisVehicleWorld.cs'
      - 'Tools/Validation/VehicleRendererMaterialReuseTests.cs'
      - 'Tools/Validation/run_vehicle_renderer_material_reuse_csharp.py'
      - 'Tools/Validation/test_android_vehicle_renderer_material_reuse.py'
      - 'Tools/Validation/test_vehicle_visible_body_guard.py'
      - '.github/workflows/aaris-android-renderer-material-qa.yml'
  push:
    branches: [main]
    paths:
      - 'Assets/AarisWorld/Scripts/AarisVehicleWorld.cs'
      - 'Tools/Validation/VehicleRendererMaterialReuseTests.cs'
      - 'Tools/Validation/run_vehicle_renderer_material_reuse_csharp.py'
      - 'Tools/Validation/test_android_vehicle_renderer_material_reuse.py'
      - 'Tools/Validation/test_vehicle_visible_body_guard.py'
      - '.github/workflows/aaris-android-renderer-material-qa.yml'

permissions:
  contents: read

jobs:
  renderer-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source visibility and authored URP paint constraints
        run: |
          python3 Tools/Validation/test_android_vehicle_renderer_material_reuse.py
          python3 Tools/Validation/test_vehicle_visible_body_guard.py
          python3 Tools/Validation/test_vehicle_visual_fidelity.py
          python3 Tools/Validation/test_android_vehicle_bounds_query_reuse.py
          python3 Tools/Validation/test_android_authored_vehicle_validation_scratch.py
          python3 Tools/Validation/check_vehicle_system.py
      - name: Compile real wheel visibility and URP preflight in Mono
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mono-mcs
          python3 Tools/Validation/run_vehicle_renderer_material_reuse_csharp.py
      - name: Parse production Unity C sharp and check test script syntax
        run: |
          python3 -m pip install --disable-pip-version-check 'tree-sitter>=0.23,<0.26' tree-sitter-c-sharp
          python3 - <<'PY'
          from pathlib import Path
          from tree_sitter import Language,Parser
          import tree_sitter_c_sharp
          parser=Parser(Language(tree_sitter_c_sharp.language()))
          path=Path('Assets/AarisWorld/Scripts/AarisVehicleWorld.cs')
          source=path.read_bytes()
          assert not parser.parse(source).root_node.has_error,path
          assert all(line==line.rstrip() for line in source.decode().splitlines()),path
          print('VEHICLE_RENDERER_MATERIAL_PRODUCTION_CSHARP_PARSE_PASS')
          PY
          python3 -m py_compile Tools/Validation/test_android_vehicle_renderer_material_reuse.py \
            Tools/Validation/run_vehicle_renderer_material_reuse_csharp.py
