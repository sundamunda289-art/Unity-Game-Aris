name: Map explorer checks
on:
  push:
    branches: [review/map-explorer-camera-20261103]
  pull_request:
    paths:
      - 'Assets/AarisWorld/Scripts/**'
      - 'Assets/AarisWorld/Editor/**'
      - 'Assets/TerrainDemoScene_URP/Scenes/TerrainDemoScene.unity'
      - 'ProjectSettings/**'
      - 'Packages/manifest.json'
      - 'Tools/Validation/check_explorer.py'
      - 'Tools/Validation/check_battle_hud.py'
      - 'Tools/Validation/simulate_battle_feel.py'
      - 'Tools/Validation/check_battle_hardening.py'
      - 'Tools/Validation/check_weapon_loot.py'
      - 'Tools/Validation/check_single_weapon_transactions.py'
      - 'Tools/Validation/check_armed_locomotion.py'
      - 'Tools/Validation/check_vehicle_system.py'
      - 'Tools/Validation/check_vehicle_drive_hardening.py'
      - 'Tools/Validation/check_gameplay_collision_hardening.py'
      - 'Assets/Resources/AarisVehicles/**'
      - 'Docs/MAP_LAYOUT.json'
      - '.github/workflows/aaris-vehicle-vendor.yml'
      - 'Tools/Weapons/bake_loot.py'
      - 'Assets/Resources/AarisWeapons/**'
      - 'Tools/Validation/check_mobile_review.py'
      - 'Assets/AarisWorld/Props/**'
      - 'Docs/MOBILE_REVIEW_REPORT.json'
      - 'Tools/Validation/check_road_markings.py'
      - 'Tools/MapBuild/road_markings.py'
      - 'Tools/MapBuild/surface_native.py'
      - 'Tools/MapBuild/world_review.py'
      - 'Tools/Validation/check_world_review.py'
      - 'Tools/Validation/check_render_review.py'
      - 'Tools/Validation/check_shader_compile.py'
      - 'Tools/Validation/check_material_import.py'
      - 'Tools/MapBuild/render_review.py'
      - 'Tools/MapBuild/native_assets.py'
      - 'Tools/MapBuild/surfaces.py'
      - 'Assets/AarisWorld/Surfaces/CoastalWater.shader'
      - '.github/workflows/explorer-checks.yml'
permissions:
  contents: read
jobs:
  saved-camera-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 Pillow==12.3.0 PyYAML==6.0.3 tree-sitter==0.26.0 tree-sitter-c-sharp==0.23.5
      - name: Check C# syntax, saved ground player and native terrain pointers
        run: python Tools/Validation/check_explorer.py
      - name: Check five-button HUD, single player motor and offline battle controls
        run: python Tools/Validation/check_battle_hud.py
      - name: Simulate smooth battle sprint and jump at 30, 60 and 120 FPS
        run: python Tools/Validation/simulate_battle_feel.py
      - name: Adversarial HUD and animation hardening checks
        run: python Tools/Validation/check_battle_hardening.py
      - name: Verify five locally vendored weapons, catalog and authored loot coordinates
        run: python Tools/Validation/check_weapon_loot.py
      - name: Simulate 10000 one-gun pickup, drop and exchange transactions
        run: python Tools/Validation/check_single_weapon_transactions.py
      - name: Check weapon-ready locomotion and masked upper-body animation
        run: python Tools/Validation/check_armed_locomotion.py
      - name: Verify local Kenney cars, 45 real markers, 33 road stops and four-arrow driving
        run: python Tools/Validation/check_vehicle_system.py
      - name: Stress-test vehicle exit, parking brakes, anti-roll and camera collision
        run: python Tools/Validation/check_vehicle_drive_hardening.py
      - name: Test streamed collision volumes, vehicle entry and gun mesh scale
        run: python Tools/Validation/check_gameplay_collision_hardening.py

      - name: Check painted road geometry across paved triangle boundaries
        run: python Tools/Validation/check_road_markings.py
      - name: Check core building prefabs, world proportions and daylight
        run: python Tools/Validation/check_world_review.py
      - name: Check renderer layer coverage and source-correct materials
        run: python Tools/Validation/check_render_review.py
      - name: Check source material semantics and occlusion channel packing
        run: python Tools/Validation/check_material_import.py
      - name: Check mobile saved bindings, props and preserved visual settings
        run: python Tools/Validation/check_mobile_review.py
