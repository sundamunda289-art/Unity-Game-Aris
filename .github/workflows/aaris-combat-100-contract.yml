name: Aaris 100-rival combat contracts and C-sharp syntax

on:
  pull_request:
    paths:
      - 'Assets/AarisWorld/Scripts/AarisOfflineHealth.cs'
      - 'Assets/AarisWorld/Scripts/AarisOfflineBRDirector.cs'
      - 'Assets/AarisWorld/Scripts/AarisMassBotPopulation.cs'
      - 'Assets/AarisWorld/Scripts/AarisCombatFeedbackHUD.cs'
      - 'Assets/AarisWorld/Scripts/AarisEquippedGun.cs'
      - 'Assets/AarisWorld/Scripts/AarisCombatSelectionPolicy.cs'
      - 'Tools/Validation/CombatSelectionPolicyTests.cs'
      - 'Assets/AarisWorld/Scripts/AarisThirdPersonPlayer.cs'
      - 'Tools/Validation/test_combat_mass_bot_contract.py'
      - '.github/workflows/aaris-combat-100-contract.yml'
  push:
    branches: [main]
    paths:
      - 'Assets/AarisWorld/Scripts/AarisOfflineHealth.cs'
      - 'Assets/AarisWorld/Scripts/AarisOfflineBRDirector.cs'
      - 'Assets/AarisWorld/Scripts/AarisMassBotPopulation.cs'
      - 'Assets/AarisWorld/Scripts/AarisCombatFeedbackHUD.cs'
      - 'Assets/AarisWorld/Scripts/AarisEquippedGun.cs'
      - 'Assets/AarisWorld/Scripts/AarisCombatSelectionPolicy.cs'
      - 'Tools/Validation/CombatSelectionPolicyTests.cs'
      - 'Assets/AarisWorld/Scripts/AarisThirdPersonPlayer.cs'
      - 'Tools/Validation/test_combat_mass_bot_contract.py'
      - '.github/workflows/aaris-combat-100-contract.yml'

permissions:
  contents: read

jobs:
  combat-static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify cross-file 100-rival combat contracts
        run: python3 Tools/Validation/test_combat_mass_bot_contract.py
      - name: Execute production two-attacker policy in real C-sharp runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mono-mcs
          mcs -optimize+ -out:/tmp/aaris-combat-selection.exe \
            Assets/AarisWorld/Scripts/AarisCombatSelectionPolicy.cs \
            Tools/Validation/CombatSelectionPolicyTests.cs
          mono /tmp/aaris-combat-selection.exe
      - name: Validate authored Unity C-sharp grammar
        run: |
          python3 -m pip install --disable-pip-version-check 'tree-sitter>=0.23,<0.26' tree-sitter-c-sharp
          python3 - <<'PY'
          from pathlib import Path
          from tree_sitter import Language, Parser
          import tree_sitter_c_sharp
          parser = Parser(Language(tree_sitter_c_sharp.language()))
          files = [
              'AarisOfflineHealth.cs', 'AarisEquippedGun.cs',
              'AarisOfflineBRDirector.cs', 'AarisMassBotPopulation.cs',
              'AarisCombatFeedbackHUD.cs', 'AarisThirdPersonPlayer.cs',
              'AarisCombatSelectionPolicy.cs',
              'AarisWeaponInventory.cs',
          ]
          base = Path('Assets/AarisWorld/Scripts')
          for name in files:
              source = (base / name).read_bytes()
              assert not parser.parse(source).root_node.has_error, name
              print('CSHARP_PARSE_PASS', name)
          print('Grammar-only gate: real Unity Editor compile/PlayMode still required.')
          PY
