name: Isolated Unity real project headless import diagnosis
on:
  push:
    branches: ['review/deep-forest-terrain-bake-20261109']
    paths:
      - 'Tools/Codespaces/real_project_import_diagnostic.sh'
      - '.github/workflows/aaris-headless-import-diagnostic.yml'
permissions:
  contents: read
  issues: write
jobs:
  import-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    concurrency:
      group: aaris-codespace-control
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false}
      - name: Run fixed headless import diagnosis on isolated old snapshot
        id: diagnose
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
        run: |
          set -Eeuo pipefail
          bash -n Tools/Codespaces/real_project_import_diagnostic.sh
          test -n "${GH_TOKEN:-}"
          timeout 480 gh codespace ssh -c aaris-ai-ubuntu-minimal-jrg7rgvx5rr435wpp -- 'bash -s' \
            < Tools/Codespaces/real_project_import_diagnostic.sh
      - name: Report issue command outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DIAG_OUTCOME: ${{ steps.diagnose.outcome }}
        run: |
          set -euo pipefail
          gh issue comment 77 -R "$GITHUB_REPOSITORY" -b "REAL UNITY PROJECT HEADLESS IMPORT / VULKAN DIAGNOSTIC: ${DIAG_OUTCOME:-inconclusive}; no source files edited. [Categorized log](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
