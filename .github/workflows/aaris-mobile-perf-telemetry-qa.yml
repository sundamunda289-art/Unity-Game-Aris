name: Aaris Android Perf Telemetry Source QA

on:
  pull_request:
    paths:
      - 'Assets/AarisWorld/Scripts/AarisMobilePerfOverlay.cs'
      - 'Assets/AarisWorld/Scripts/AarisMobilePerfOverlay.cs.meta'
      - 'Tools/Validation/test_android_perf_overlay.py'
      - 'Docs/ANDROID_PERF_OVERLAY_CSV_20261120.md'
      - '.github/workflows/aaris-mobile-perf-telemetry-qa.yml'
  push:
    branches: [main]
    paths:
      - 'Assets/AarisWorld/Scripts/AarisMobilePerfOverlay.cs'
      - 'Assets/AarisWorld/Scripts/AarisMobilePerfOverlay.cs.meta'
      - 'Tools/Validation/test_android_perf_overlay.py'
      - '.github/workflows/aaris-mobile-perf-telemetry-qa.yml'

permissions:
  contents: read

jobs:
  isolated-perf-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify opt-in and bounded telemetry contracts
        run: python Tools/Validation/test_android_perf_overlay.py
      - name: Parse Unity C# syntax and verify added sources are whitespace-clean
        run: |
          python -m pip install --disable-pip-version-check 'tree-sitter>=0.23,<0.26' tree-sitter-c-sharp
          python - <<'PY'
          from pathlib import Path
          from tree_sitter import Language, Parser
          import tree_sitter_c_sharp
          source = Path('Assets/AarisWorld/Scripts/AarisMobilePerfOverlay.cs')
          paths = [
              source,
              Path('Assets/AarisWorld/Scripts/AarisMobilePerfOverlay.cs.meta'),
              Path('Tools/Validation/test_android_perf_overlay.py'),
              Path('Docs/ANDROID_PERF_OVERLAY_CSV_20261120.md'),
          ]
          parser = Parser(Language(tree_sitter_c_sharp.language()))
          assert not parser.parse(source.read_bytes()).root_node.has_error
          for path in paths:
              assert path.is_file(), str(path)
              assert all(line == line.rstrip() for line in path.read_text(encoding='utf8').splitlines()), str(path)
          print('PASS: telemetry source syntax and whitespace')
          print('NOTE: This is not native Unity Editor compilation or Android profiling.')
          PY
