name: Mobile nature illusion static QA
on:
  pull_request:
    paths:
      - 'Assets/TerrainDemoScene_URP/ShaderGraphs/**'
      - 'Assets/TerrainDemoScene_URP/Prefabs/Trees/**'
      - 'Assets/TerrainDemoScene_URP/Prefabs/Details/Textures/*.meta'
      - 'Assets/TerrainDemoScene_URP/Prefabs/Details/Materials/**'
      - 'Assets/AarisWorld/Scripts/AarisVehicleSession.cs'
      - 'Tools/Validation/test_mobile_foliage_illusion_contract.py'
      - 'Tools/Validation/check_foliage_shader_compile.py'
      - '.github/workflows/aaris-mobile-nature-illusion-qa.yml'
  push:
    branches: [main]
    paths:
      - 'Assets/TerrainDemoScene_URP/ShaderGraphs/**'
      - 'Assets/TerrainDemoScene_URP/Prefabs/Trees/**'
      - 'Assets/TerrainDemoScene_URP/Prefabs/Details/Textures/*.meta'
      - 'Assets/TerrainDemoScene_URP/Prefabs/Details/Materials/**'
      - 'Assets/AarisWorld/Scripts/AarisVehicleSession.cs'
      - 'Tools/Validation/test_mobile_foliage_illusion_contract.py'
      - 'Tools/Validation/check_foliage_shader_compile.py'
      - '.github/workflows/aaris-mobile-nature-illusion-qa.yml'

permissions:
  contents: read

jobs:
  foliage-static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Hydrate only the native ground-foliage material LFS objects
        run: |
          git lfs pull --include='Assets/TerrainDemoScene_URP/Prefabs/Details/Materials/*.asset' --exclude=''
      - name: Check mobile vegetation Shader Graph bindings and math
        run: |
          python3 Tools/Validation/test_mobile_foliage_illusion_contract.py
      - name: Validate original tree LODs and reduced shadow workload
        run: |
          python3 Tools/Validation/test_mobile_tree_shadows.py
      - name: Classify evidence honestly
        run: |
          echo 'Static contract complete; the native Unity foliage render/compile job is the separate hard gate. Physical Android profiling is still required.'


  foliage-hlsl-dxc:
    name: Pinned URP 17.3 mobile HLSL compiler gate
    needs: foliage-static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Prepare verified DXC and pinned Unity Graphics headers
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/linux_dxc_2026_09_28.x86_x64.tar.gz \
            -o /tmp/aaris-dxc.tar.gz
          echo '96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1  /tmp/aaris-dxc.tar.gz' | sha256sum --check
          rm -rf /tmp/aaris-dxc /tmp/aaris-unity-graphics
          mkdir -p /tmp/aaris-dxc
          tar -xzf /tmp/aaris-dxc.tar.gz -C /tmp/aaris-dxc
          git init -q /tmp/aaris-unity-graphics
          git -C /tmp/aaris-unity-graphics remote add origin https://github.com/Unity-Technologies/Graphics.git
          git -C /tmp/aaris-unity-graphics sparse-checkout init --cone
          git -C /tmp/aaris-unity-graphics sparse-checkout set \
            Packages/com.unity.render-pipelines.core \
            Packages/com.unity.render-pipelines.universal \
            Packages/com.unity.render-pipelines.core-config \
            Packages/com.unity.render-pipelines.universal-config \
            Packages/com.unity.shadergraph
          git -C /tmp/aaris-unity-graphics fetch --filter=blob:none --depth=1 origin 4064d5bb6a1e3748a7cdddc244b89934ad1c3145
          GIT_LFS_SKIP_SMUDGE=1 git -C /tmp/aaris-unity-graphics checkout --detach FETCH_HEAD

          # SpeedTree8Input references a Unity Editor built-in include which is
          # not stored in the Graphics package repository. Pull the exact
          # official built-in shader archive for Unity 6000.3.26f1 changeset
          # de8167e7440c and extract only SpeedTreeWind.cginc.
          curl --fail --location --retry 3 \
            https://download.unity3d.com/download_unity/de8167e7440c/builtin_shaders-6000.3.26f1.zip \
            -o /tmp/aaris-unity-builtin-shaders.zip
          rm -rf /tmp/aaris-unity-cgincludes
          mkdir -p /tmp/aaris-unity-cgincludes
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('/tmp/aaris-unity-builtin-shaders.zip')
          out = Path('/tmp/aaris-unity-cgincludes/SpeedTreeWind.cginc')
          with ZipFile(archive) as z:
              matches = [n for n in z.namelist() if n == 'SpeedTreeWind.cginc' or n.endswith('/SpeedTreeWind.cginc')]
              assert len(matches) == 1, matches
              data = z.read(matches[0])
          assert len(data) > 1000
          out.write_bytes(data)
          PY
          test -s /tmp/aaris-unity-cgincludes/SpeedTreeWind.cginc
          grep -q 'SPEEDTREE_WIND_INCLUDED' /tmp/aaris-unity-cgincludes/SpeedTreeWind.cginc

      - name: Compile representative Fast and Fastest foliage variants for mobile Vulkan
        run: |
          set -euo pipefail
          python3 Tools/Validation/check_foliage_shader_compile.py \
            --dxc /tmp/aaris-dxc/bin/dxc \
            --graphics /tmp/aaris-unity-graphics \
            --cgincludes /tmp/aaris-unity-cgincludes

  foliage-unity-compile:
    name: Unity 6000.3.26f1 foliage compile/render gate
    needs: [foliage-static-contract, foliage-hlsl-dxc]
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GAMECI_IMAGE: unityci/editor:ubuntu-6000.3.26f1-base-3
      FOLIAGE_RUN: /tmp/aaris-foliage-unity
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Require repository Unity license without exposing it
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          if [[ -z "$UNITY_LICENSE" || "$UNITY_LICENSE" != *"<"* ]]; then
            echo '::error::UNITY_LICENSE is not configured for the native foliage compile gate.'
            exit 2
          fi
          echo 'UNITY_LICENSE_PRESENT'

      - name: Free runner storage and hydrate native Unity assets
        run: |
          set -euo pipefail
          bash Tools/CI/runner_storage.sh cleanup || true
          git lfs install --local
          git lfs pull --include='Assets/**' --exclude=''
          if head -c 100 Assets/TerrainDemoScene_URP/Scenes/TerrainDemoScene.unity | grep -q 'git-lfs.github.com/spec'; then
            echo '::error::Native terrain scene is still an LFS pointer.'
            exit 3
          fi
          rm -rf "$FOLIAGE_RUN"
          mkdir -p "$FOLIAGE_RUN"

      - name: Import project and render native foliage with pinned Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          docker pull "$GAMECI_IMAGE"
          docker run --rm --shm-size=1g \
            -e UNITY_LICENSE \
            -e LIBGL_ALWAYS_SOFTWARE=1 -e GALLIUM_DRIVER=llvmpipe \
            -v "$PWD:/project" \
            -v "$FOLIAGE_RUN:/tmp/aaris-codespaces/scene-probe" \
            -w /project "$GAMECI_IMAGE" bash -lc '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends xvfb libgl1-mesa-dri libglu1-mesa
              mkdir -p /root/.local/share/unity3d/Unity
              printf "%s" "$UNITY_LICENSE" > /root/.local/share/unity3d/Unity/Unity_lic.ulf
              chmod 600 /root/.local/share/unity3d/Unity/Unity_lic.ulf
              xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX" \
                unity-editor -projectPath /project -batchmode -force-glcore \
                -job-worker-count 2 \
                -executeMethod Aaris.MapReview.Editor.AarisCodespaceSceneProbe.DiagnoseFoliage \
                -quit -logFile /tmp/aaris-codespaces/scene-probe/unity-editor.log
            '

      - name: Require zero C-sharp/shader errors and real foliage evidence
        run: |
          set -euo pipefail
          test -s "$FOLIAGE_RUN/unity-editor.log"
          test -s "$FOLIAGE_RUN/foliage-report.json"
          if grep -Eqi 'error CS[0-9]{4}:|Shader error in|Shader compiler error|failed to compile' "$FOLIAGE_RUN/unity-editor.log"; then
            echo '::error::Unity log contains a C# or shader compile error.'
            grep -Ei 'error CS[0-9]{4}:|Shader error in|Shader compiler error|failed to compile' "$FOLIAGE_RUN/unity-editor.log" | head -n 40
            exit 4
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/aaris-foliage-unity')
          report = json.loads((root / 'foliage-report.json').read_text())
          assert report.get('status') == 'passed', report
          assert report.get('reason') == 'REAL_SPEEDTREE_LOD_AND_LIGHTING_COMPARISON', report
          assert report.get('unityVersion') == '6000.3.26f1', report
          assert int(report.get('terrainTiles', 0)) == 4, report
          assert int(report.get('foliageRenderers', 0)) > 0, report
          assert int(report.get('customFoliageMaterials', 0)) > 0, report
          images = report.get('images') or []
          assert len(images) == 5, report
          for name in images:
              p = root / name
              assert p.is_file() and p.stat().st_size > 8192, (name, p.stat().st_size if p.exists() else 0)
          log = (root / 'unity-editor.log').read_text(errors='replace')
          assert 'AARIS_NATIVE_FOLIAGE_DIAG_PASSED' in log
          print('AARIS_NATIVE_FOLIAGE_UNITY_COMPILE_RENDER_PASS')
          print(json.dumps({
              'unityVersion': report['unityVersion'],
              'graphicsDevice': report.get('graphicsDevice'),
              'terrainTiles': report['terrainTiles'],
              'foliageRenderers': report['foliageRenderers'],
              'customFoliageMaterials': report['customFoliageMaterials'],
          }, sort_keys=True))
          PY

      - name: Upload bounded native foliage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaris-foliage-native-${{ github.run_id }}
          path: |
            /tmp/aaris-foliage-unity/foliage-report.json
            /tmp/aaris-foliage-unity/foliage-*.png
            /tmp/aaris-foliage-unity/unity-editor.log
          retention-days: 3
          if-no-files-found: warn
