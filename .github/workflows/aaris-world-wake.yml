name: Aaris AI World - Wake Codespace

on:
  push:
    branches: [main]
    paths:
      - 'ai/requests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aaris-world-codespace-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start configured Codespace via official lifecycle API
        shell: bash
        env:
          CS_NAME: ${{ vars.AARIS_CODESPACE_NAME }}
          CS_TOKEN: ${{ secrets.AARIS_CODESPACE_LIFECYCLE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CS_NAME" || -z "$CS_TOKEN" ]]; then
            echo "Missing AARIS_CODESPACE_NAME variable or AARIS_CODESPACE_LIFECYCLE_TOKEN secret." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ ! "$CS_NAME" =~ ^[A-Za-z0-9-]{1,100}$ ]]; then
            echo "Invalid configured Codespace name." >&2
            exit 1
          fi

          api="https://api.github.com/user/codespaces/$CS_NAME"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
            -H "Authorization: Bearer $CS_TOKEN"
          )
          details="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api")"
          repo="$(jq -r '.repository.full_name // empty' <<< "$details")"
          state="$(jq -r '.state // empty' <<< "$details")"

          if [[ "$repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "Refusing to start Codespace for a different repository: $repo" >&2
            exit 1
          fi

          case "$state" in
            Available|Starting|Queued)
              echo "Codespace $CS_NAME already $state." >> "$GITHUB_STEP_SUMMARY"
              ;;
            Shutdown)
              curl --fail-with-body --silent --show-error \
                "${headers[@]}" -X POST "$api/start" > /dev/null
              echo "Start requested for $CS_NAME. Worker readiness has NOT been verified." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Codespace $CS_NAME state is '$state'; no unsafe rebuild/start attempted." >&2
              exit 1
              ;;
          esac
