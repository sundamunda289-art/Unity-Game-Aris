name: Opt-in World Chunk Streaming QA

on:
  pull_request:
    paths:
      - 'Assets/AarisWorld/Scripts/AarisChunkStreamingPolicy.cs'
      - 'Assets/AarisWorld/Scripts/AarisAdditiveChunkStreamer.cs'
      - 'Tools/Validation/AdditiveChunkStreamingTests.cs'
      - 'Tools/Validation/test_additive_chunk_streaming.py'
      - '.github/workflows/aaris-opt-in-world-chunks-qa.yml'
  push:
    branches: [main]
    paths:
      - 'Assets/AarisWorld/Scripts/AarisChunkStreamingPolicy.cs'
      - 'Assets/AarisWorld/Scripts/AarisAdditiveChunkStreamer.cs'
      - 'Tools/Validation/AdditiveChunkStreamingTests.cs'
      - 'Tools/Validation/test_additive_chunk_streaming.py'
      - '.github/workflows/aaris-opt-in-world-chunks-qa.yml'

permissions:
  contents: read

jobs:
  isolated-chunk-streamer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python Tools/Validation/test_additive_chunk_streaming.py
      - name: Compile and execute production scripts using minimal Unity stubs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mono-mcs
          mcs -out:/tmp/aaris-chunks-qa.exe \
            Assets/AarisWorld/Scripts/AarisChunkStreamingPolicy.cs \
            Assets/AarisWorld/Scripts/AarisAdditiveChunkStreamer.cs \
            Tools/Validation/AdditiveChunkStreamingTests.cs
          mono /tmp/aaris-chunks-qa.exe
          mcs -define:UNITY_ANDROID -out:/tmp/aaris-chunks-android-qa.exe \
            Assets/AarisWorld/Scripts/AarisChunkStreamingPolicy.cs \
            Assets/AarisWorld/Scripts/AarisAdditiveChunkStreamer.cs \
            Tools/Validation/AdditiveChunkStreamingTests.cs
          mono /tmp/aaris-chunks-android-qa.exe
      - name: Parse authored C# with tree-sitter
        run: |
          python -m pip install --disable-pip-version-check 'tree-sitter>=0.23,<0.26' tree-sitter-c-sharp
          python - <<'PY'
          from pathlib import Path
          from tree_sitter import Language, Parser
          import tree_sitter_c_sharp
          parser = Parser(Language(tree_sitter_c_sharp.language()))
          for path in [
              Path('Assets/AarisWorld/Scripts/AarisChunkStreamingPolicy.cs'),
              Path('Assets/AarisWorld/Scripts/AarisAdditiveChunkStreamer.cs'),
              Path('Tools/Validation/AdditiveChunkStreamingTests.cs'),
          ]:
              src = path.read_bytes()
              assert not parser.parse(src).root_node.has_error, path
              assert all(line == line.rstrip() for line in src.decode().splitlines()), path
          print('PASS: C# source syntax/format')
          PY
