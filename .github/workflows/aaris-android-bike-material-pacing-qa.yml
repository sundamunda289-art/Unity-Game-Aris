name: Android Bike Material Integration QA

on:
  pull_request:
    paths:
      - 'Assets/AarisWorld/Scripts/AarisRoadsideBikeScenery.cs'
      - 'Tools/Validation/test_android_bike_material_pacing.py'
      - 'Tools/Validation/run_bike_material_csharp.py'
      - 'Tools/Validation/test_android_bike_layout_cache.py'
      - 'Tools/Validation/run_bike_layout_cache_csharp.py'
      - 'Docs/ANDROID_ROADSIDE_MATERIAL_FRAME_PACING_20261120.md'
      - '.github/workflows/aaris-android-bike-material-pacing-qa.yml'
  push:
    branches: [main]
    paths:
      - 'Assets/AarisWorld/Scripts/AarisRoadsideBikeScenery.cs'
      - 'Tools/Validation/test_android_bike_material_pacing.py'
      - 'Tools/Validation/run_bike_material_csharp.py'
      - 'Tools/Validation/test_android_bike_layout_cache.py'
      - 'Tools/Validation/run_bike_layout_cache_csharp.py'
      - '.github/workflows/aaris-android-bike-material-pacing-qa.yml'

permissions:
  contents: read

jobs:
  source-qa:
    # Keep Mono fixture dependencies on the supported Ubuntu 24.04 LTS
    # instead of the moving runner image whose mirror downloads timed out.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regress staged URP palette, source import, and shared-gate ownership
        run: |
          python Tools/Validation/test_android_bike_material_pacing.py
          python Tools/Validation/test_android_bike_layout_cache.py
          python Tools/Validation/test_android_roadside_prewarm.py
          python Tools/Validation/test_android_shared_streaming_frame_gate.py
      - name: Compile and execute production material builder on desktop and Android C-sharp defines
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends mono-mcs
          python Tools/Validation/run_bike_material_csharp.py
          python Tools/Validation/run_bike_layout_cache_csharp.py
      - name: Parse modified Unity C-sharp and verify whitespace
        run: |
          python -m pip install --disable-pip-version-check 'tree-sitter>=0.23,<0.26' tree-sitter-c-sharp
          python - <<'PY'
          from pathlib import Path
          from tree_sitter import Language, Parser
          import tree_sitter_c_sharp
          parser = Parser(Language(tree_sitter_c_sharp.language()))
          paths = [
              Path('Assets/AarisWorld/Scripts/AarisRoadsideBikeScenery.cs'),
              Path('Tools/Validation/test_android_bike_material_pacing.py'),
              Path('Tools/Validation/run_bike_material_csharp.py'),
              Path('Tools/Validation/test_android_bike_layout_cache.py'),
              Path('Tools/Validation/run_bike_layout_cache_csharp.py'),
              Path('Docs/ANDROID_ROADSIDE_MATERIAL_FRAME_PACING_20261120.md'),
          ]
          for path in paths:
              assert path.is_file(), str(path)
              data = path.read_text(encoding='utf-8')
              assert all(line == line.rstrip() for line in data.splitlines()), str(path)
              if path.suffix == '.cs':
                  assert not parser.parse(data.encode('utf-8')).root_node.has_error, str(path)
          print('PASS: source invariants, C# parser, whitespace.')
          print('Not native Unity Editor compilation or real Snapdragon 680 profiling.')
          PY
