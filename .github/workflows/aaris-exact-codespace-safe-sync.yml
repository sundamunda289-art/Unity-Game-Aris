name: Aaris Exact Codespace Canonical Safe Sync

on:
  pull_request:
    paths:
      - '.github/workflows/aaris-exact-codespace-safe-sync.yml'
      - 'Tools/Codespaces/canonical_safe_sync.sh'
      - 'Tools/Codespaces/editor_status_readonly.sh'
      - 'Tools/Codespaces/native_source_compile_sandbox.sh'
      - 'Tools/Codespaces/unity_empty_project_baseline.sh'
      - 'Tools/Codespaces/unity_package_matrix_probe.sh'
      - 'Tools/Codespaces/native_source_split_sandbox.sh'
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse safe-sync shell and forbid destructive commands
        run: |
          set -euo pipefail
          bash -n Tools/Codespaces/canonical_safe_sync.sh
          bash -n Tools/Codespaces/editor_status_readonly.sh
          bash -n Tools/Codespaces/native_source_compile_sandbox.sh
          bash -n Tools/Codespaces/unity_empty_project_baseline.sh
          bash -n Tools/Codespaces/unity_package_matrix_probe.sh
          bash -n Tools/Codespaces/native_source_split_sandbox.sh
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Tools/Codespaces/canonical_safe_sync.sh').read_text()
          for required in ('--ff-only', 'merge-base --is-ancestor',
                           '--no-filters', 'tracked_local_changes_preserved',
                           'FETCH_HEAD', 'CANONICAL=https://github.com/sundamunda289-art/Unity-Game-Aris.git'):
              assert required in s, required
          for forbidden in ('git reset', 'git clean', 'git stash', 'git worktree',
                            'git checkout -f', 'git push'):
              assert forbidden not in s.split('set -euo pipefail', 1)[1], forbidden
          diagnostic = Path('Tools/Codespaces/editor_status_readonly.sh').read_text()
          assert 'AARIS_EDITOR_STATUS_NATIVE_COMPILE_PROVEN=no' in diagnostic
          assert 'EDITOR_STATUS_PROJECT_PROCESS_COUNT' in diagnostic
          for forbidden in ('git reset', 'git clean', 'git stash', 'git worktree',
                            'Editor/Unity -batchmode', 'subprocess.run(', 'os.kill('):
              assert forbidden not in diagnostic, forbidden
          native = Path('Tools/Codespaces/native_source_compile_sandbox.sh').read_text()
          for required in ('mktemp -d', 'AARIS_NATIVE_COMPILE_RESULT=',
                           'AarisNativeSourceCompileGate.Run', 'xvfb-run -a',
                           '-batchmode -force-glcore', '-quit', 'LIBGL_ALWAYS_SOFTWARE=1'):
              assert required in native, required
          assert 'case "$MODE" in status|sync|fetch)' in s
          assert 'if [[ "$MODE" == sync && "$BRANCH" != main ]]' in s
          assert 'if [[ "$MODE" == fetch ]]; then' in s
          assert 'git update-ref refs/remotes/aaris-canonical/main "$TARGET"' in s
          assert 'AARIS_SYNC_SUCCESS=reference_only' in s
          assert 'git reset' not in native and 'git worktree' not in native
          assert 'AARIS_NATIVE_COMPILE_TEMP_PACKAGE_LOCK=omitted' in native
          # Native Linux Unity A/B: subdirectory TMPDIR fails with exit 255,
          # using the parent temporary root passes and executes the C# gate.
          assert 'env TMPDIR="$WORK" LIBGL_ALWAYS_SOFTWARE=1' in native
          assert 'env TMPDIR="$WORK/UnityTemp"' not in native
          assert 'cp "$SOURCE/Packages/packages-lock.json"' not in native
          baseline = Path('Tools/Codespaces/unity_empty_project_baseline.sh').read_text()
          assert 'mktemp -d /tmp/aaris-unity-empty.' in baseline
          assert 'AARIS_UNITY_BASELINE_RESULT=empty_editor_pass' in baseline
          assert '-batchmode -nographics -quit' in baseline
          assert 'AARIS_UNITY_BASELINE_PACKAGE_PROJECT_GAME_SCRIPTS=0' in baseline
          assert 'git reset' not in baseline and 'git worktree' not in baseline
          matrix = Path('Tools/Codespaces/unity_package_matrix_probe.sh').read_text()
          for required in ('mktemp -d', 'AARIS_PKG_MATRIX_RESULT=diagnostic_completed',
                           'full_graphics', 'modules ugui urp vfx full', 'xvfb-run -a'):
              assert required in matrix, required
          assert 'git reset' not in matrix and 'git worktree' not in matrix
          split = Path('Tools/Codespaces/native_source_split_sandbox.sh').read_text()
          for required in ('AARIS_SOURCE_SPLIT_RESULT=diagnostic_completed',
                           'for name in runtime all', 'Assets/AarisWorld/Editor',
                           'Assets/AarisWorld/Scripts', 'mktemp -d'):
              assert required in split, required
          assert 'git reset' not in split and 'git worktree' not in split
          print('AARIS_SAFE_SYNC_STATIC_PASS')
          PY

  exact-sync:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 77 &&
      github.event.comment.user.login == 'sundamunda289-art' &&
      (startsWith(github.event.comment.body, 'AARIS CANONICAL STATUS ') ||
       startsWith(github.event.comment.body, 'AARIS CANONICAL FETCH ') ||
       startsWith(github.event.comment.body, 'AARIS CANONICAL SYNC ') ||
       startsWith(github.event.comment.body, 'AARIS CANONICAL COMPILE ') ||
       startsWith(github.event.comment.body, 'AARIS CANONICAL EDITOR_STATUS ') ||
       startsWith(github.event.comment.body, 'AARIS CANONICAL NATIVE_COMPILE ') ||
       startsWith(github.event.comment.body, 'AARIS CANONICAL UNITY_BASELINE ') ||
       startsWith(github.event.comment.body, 'AARIS CANONICAL PKG_MATRIX ') ||
       startsWith(github.event.comment.body, 'AARIS CANONICAL SOURCE_SPLIT '))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    concurrency:
      group: aaris-exact-codespace-safe-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select owner-named existing Codespace on authorized account
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          REQUEST: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo 'AARIS_SAFE_SYNC_TOKEN_NOT_CONFIGURED'; exit 11; }
          [[ "$REQUEST" =~ ^AARIS[[:space:]]CANONICAL[[:space:]](STATUS|SYNC|FETCH|COMPILE|EDITOR_STATUS|NATIVE_COMPILE|UNITY_BASELINE|PKG_MATRIX|SOURCE_SPLIT)[[:space:]](aaris-ai-[a-zA-Z0-9-]{3,110})$ ]] || {
            echo 'AARIS_SAFE_SYNC_INVALID_REQUEST'; exit 12;
          }
          MODE="${BASH_REMATCH[1],,}"
          MACHINE="${BASH_REMATCH[2]}"
          # The Codespace can live in a fork. List the PAT owner's machines
          # across all repos and require the exact Unity-Game-Aris suffix.
          gh codespace list --json name,state,repository --limit 100 > "$RUNNER_TEMP/codespaces.json"
          COUNT="$(jq --arg m "$MACHINE" '[.[] | select(.name==$m and
            ((.repository // "") | endswith("/Unity-Game-Aris")))] | length' "$RUNNER_TEMP/codespaces.json")"
          [[ "$COUNT" == 1 ]] || { echo 'AARIS_SAFE_SYNC_MACHINE_NOT_UNIQUE'; exit 13; }
          STATE="$(jq -r --arg m "$MACHINE" '.[] | select(.name==$m) | .state' "$RUNNER_TEMP/codespaces.json")"
          [[ "$STATE" == Available ]] || { echo "AARIS_SAFE_SYNC_MACHINE_NOT_RUNNING"; exit 14; }
          echo "SAFE_MACHINE=$MACHINE" >> "$GITHUB_ENV"
          echo "SAFE_MODE=$MODE" >> "$GITHUB_ENV"
          echo AARIS_SAFE_SYNC_MACHINE_VERIFIED=yes
      - name: Inspect or fast-forward canonical main without touching dirty files
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SAFE_MODE" == compile ]]; then
            # Read-only existing editor log, never trigger Unity refresh or
            # emit OAuth secrets / raw log lines on an issue comment.
            timeout 150 gh codespace ssh -c "$SAFE_MACHINE" -- "bash -s" \
              < Tools/Codespaces/compiler_report.sh \
              > "$RUNNER_TEMP/safe-sync-result.txt" 2> "$RUNNER_TEMP/safe-sync-private-errors.txt" || {
                echo AARIS_SAFE_SYNC_COMPILER_REPORT_UNAVAILABLE
                exit 15
              }
          elif [[ "$SAFE_MODE" == editor_status ]]; then
            # No project Editor launch or log contents exposed to the issue.
            timeout 150 gh codespace ssh -c "$SAFE_MACHINE" -- "bash -s" \
              < Tools/Codespaces/editor_status_readonly.sh \
              > "$RUNNER_TEMP/safe-sync-result.txt" 2> "$RUNNER_TEMP/safe-sync-private-errors.txt" || {
                echo AARIS_SAFE_SYNC_EDITOR_STATUS_UNAVAILABLE
                exit 16
              }
          elif [[ "$SAFE_MODE" == native_compile ]]; then
            # Source-only copy under /tmp. No original Unity project import.
            timeout 590 gh codespace ssh -c "$SAFE_MACHINE" -- "bash -s" \
              < Tools/Codespaces/native_source_compile_sandbox.sh \
              > "$RUNNER_TEMP/safe-sync-result.txt" 2> "$RUNNER_TEMP/safe-sync-private-errors.txt" || {
                echo AARIS_SAFE_SYNC_NATIVE_COMPILE_FAILED
                exit 17
              }
          elif [[ "$SAFE_MODE" == unity_baseline ]]; then
            # Independent empty project under /tmp; no game source or Editor session changed.
            timeout 550 gh codespace ssh -c "$SAFE_MACHINE" -- "bash -s" \
              < Tools/Codespaces/unity_empty_project_baseline.sh \
              > "$RUNNER_TEMP/safe-sync-result.txt" 2> "$RUNNER_TEMP/safe-sync-private-errors.txt" || {
                echo AARIS_SAFE_SYNC_UNITY_BASELINE_FAILED
                exit 18
              }
          elif [[ "$SAFE_MODE" == pkg_matrix ]]; then
            # Read-only original project. Only temporary variants are imported.
            timeout 620 gh codespace ssh -c "$SAFE_MACHINE" -- "bash -s" \
              < Tools/Codespaces/unity_package_matrix_probe.sh \
              > "$RUNNER_TEMP/safe-sync-result.txt" 2> "$RUNNER_TEMP/safe-sync-private-errors.txt" || {
                echo AARIS_SAFE_SYNC_PKG_MATRIX_UNAVAILABLE
                exit 19
              }
          elif [[ "$SAFE_MODE" == source_split ]]; then
            # Read-only original project, separate temporary Unity C# assemblies.
            timeout 630 gh codespace ssh -c "$SAFE_MACHINE" -- "bash -s" \
              < Tools/Codespaces/native_source_split_sandbox.sh \
              > "$RUNNER_TEMP/safe-sync-result.txt" 2> "$RUNNER_TEMP/safe-sync-private-errors.txt" || {
                echo AARIS_SAFE_SYNC_SOURCE_SPLIT_UNAVAILABLE
                exit 20
              }
          else
            timeout 420 gh codespace ssh -c "$SAFE_MACHINE" -- "bash -s -- $SAFE_MODE" \
              < Tools/Codespaces/canonical_safe_sync.sh \
              > "$RUNNER_TEMP/safe-sync-result.txt" 2> "$RUNNER_TEMP/safe-sync-private-errors.txt" || {
                echo AARIS_SAFE_SYNC_REMOTE_REJECTED_OR_UNAVAILABLE
                exit 15
              }
          fi
          echo AARIS_SAFE_SYNC_REMOTE_SCRIPT_COMPLETED=yes
      - name: Report only sanitized nonsecret state to owner
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '**AARIS CANONICAL CODESPACE SAFE SYNC**'
            echo
            echo '```text'
            if [[ -s "$RUNNER_TEMP/safe-sync-result.txt" ]]; then
              grep -E '^AARIS_SYNC_[A-Z0-9_]+=[a-zA-Z0-9_-]+$|^UNITY_COMPILER_(LOG_FOUND|LOG_NOT_FOUND|ERROR_COUNT_[0-9]+|ERRORS_NOT_IN_AVAILABLE_LOGS)$|^AARIS_EDITOR_STATUS_[A-Z0-9_]+=[a-zA-Z0-9_-]+$|^AARIS_NATIVE_COMPILE_[A-Z0-9_]+=[a-zA-Z0-9_-]+$|^AARIS_UNITY_BASELINE_[A-Z0-9_]+=[a-zA-Z0-9_-]+$|^AARIS_PKG_MATRIX_[A-Z0-9_]+=[a-zA-Z0-9_-]+$|^AARIS_SOURCE_SPLIT_[A-Z0-9_]+=[a-zA-Z0-9_-]+$' \
                "$RUNNER_TEMP/safe-sync-result.txt" | head -100 || true
            else
              echo 'AARIS_SYNC_RESULT=not_started_or_unavailable'
            fi
            echo '```'
            echo 'All other tracked local changes are preserved; no reset/clean/stash/worktree.'
            echo "[Run details](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > "$RUNNER_TEMP/safe-sync-owner-reply.md"
          gh issue comment 77 -R "$GITHUB_REPOSITORY" -F "$RUNNER_TEMP/safe-sync-owner-reply.md"
