name: Aaris additive settlement expansion validation
on:
  pull_request:
    paths:
      - 'Assets/AarisWorld/Scripts/AarisSettlementExpansion.cs'
      - 'Assets/AarisWorld/Scripts/AarisTreeClearanceIndex.cs*'
      - 'Assets/AarisWorld/Scripts/AarisModularHouse.cs'
      - 'Assets/AarisWorld/Scripts/AarisBreakablePanel.cs'
      - 'Assets/AarisWorld/Scripts/AarisExpansionCatalog.cs'
      - 'Assets/Resources/AarisExpansion/**'
      - 'Tools/Validation/test_settlement_expansion.py'
      - 'Tools/Validation/run_tree_clearance_csharp.py'
      - 'Tools/Validation/TreeClearanceIndexTests.cs'
      - 'Tools/Validation/test_android_selective_tree_retention.py'
      - 'Tools/Validation/test_android_tree_clearance_streaming.py'
      - 'Tools/Validation/test_settlement_streamed_obstacles.py'
      - 'Tools/Validation/test_android_settlement_relocation_frame_slice.py'
      - 'Docs/FOREST_PLANTING_PLAN.json'
      - '.github/workflows/aaris-settlement-validation.yml'
  push:
    paths:
      - 'Assets/AarisWorld/Scripts/AarisSettlementExpansion.cs'
      - 'Assets/AarisWorld/Scripts/AarisTreeClearanceIndex.cs*'
      - 'Assets/AarisWorld/Scripts/AarisModularHouse.cs'
      - 'Assets/AarisWorld/Scripts/AarisBreakablePanel.cs'
      - 'Assets/AarisWorld/Scripts/AarisExpansionCatalog.cs'
      - 'Assets/Resources/AarisExpansion/**'
      - 'Tools/Validation/test_settlement_expansion.py'
      - 'Tools/Validation/run_tree_clearance_csharp.py'
      - 'Tools/Validation/TreeClearanceIndexTests.cs'
      - 'Tools/Validation/test_android_selective_tree_retention.py'
      - 'Tools/Validation/test_android_tree_clearance_streaming.py'
      - 'Tools/Validation/test_settlement_streamed_obstacles.py'
      - 'Tools/Validation/test_android_settlement_relocation_frame_slice.py'
      - 'Docs/FOREST_PLANTING_PLAN.json'
  workflow_dispatch:
jobs:
  static-map-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Verify local models, safe building footprints, roads and vehicle bays
        run: python3 Tools/Validation/test_settlement_expansion.py
      - name: Verify Android tree cache and relocated settlement parity
        run: |
          python3 Tools/Validation/test_android_selective_tree_retention.py
          python3 Tools/Validation/test_android_tree_clearance_streaming.py
          python3 Tools/Validation/test_settlement_streamed_obstacles.py
          python3 Tools/Validation/test_android_settlement_relocation_frame_slice.py
      - name: Compile and exercise the production tree-clearance index
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mono-mcs
          python3 Tools/Validation/run_tree_clearance_csharp.py
      - name: Explain evidence level
        run: |
          echo 'Offline geometry and asset references audited; native Unity render/Play Mode still required.'
          echo 'No original TerrainData, .unity scene or Git LFS material is edited by this workflow.'
