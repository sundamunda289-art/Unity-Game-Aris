name: Aaris Turbo Dynamic Codespace Bootstrap
run-name: Aaris switch ${{ inputs.transaction_id || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      machine:
        description: "Exact Codespace, or auto only when no machine has been selected"
        required: false
        type: string
        default: "auto"
      hosting_login:
        description: "Expected Codespace hosting account"
        required: false
        type: string
        default: ""
      transaction_id:
        description: "Controller operation ID; candidate setup does not replace the active agent"
        required: false
        type: string
        default: ""
      candidate_broker:
        description: "Verified candidate aaris-turbo-terminal workers.dev origin"
        required: false
        type: string
        default: ""
      credential_secret:
        description: "Operation-scoped staged credential secret name, never a token"
        required: false
        type: string
        default: ""
      source_sha:
        description: "Immutable reviewed canonical source commit"
        required: false
        type: string
        default: ""
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/workflows/aaris-turbo-bootstrap.yml"
      - "Tools/Turbo/**"
      - "Tools/Codespaces/**"
      - ".devcontainer/**"
permissions:
  contents: read
env:
  AARIS_BROKER: ${{ vars.AARIS_BROKER_URL || 'https://aaris-turbo-terminal.aaris-game-control-6f9c.workers.dev' }}
jobs:
  static-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Transaction, cancellation, preservation and setup ordering regressions
        run: |
          set -euo pipefail
          python3 Tools/Codespaces/test_switch_controller.py
          python3 Tools/Codespaces/test_git_bridge.py
          python3 Tools/Codespaces/test_provision_codespace.py
          python3 Tools/Turbo/test_transaction_install.py
          python3 Tools/Turbo/test_bootstrap_transaction.py
          python3 Tools/Codespaces/test_cf_runner.py
          python3 Tools/Turbo/agent.py --selftest
          python3 Tools/Turbo/gui_agent.py --selftest
          python3 Tools/Turbo/select_machine.py --selftest
          python3 Tools/Turbo/device_oauth_parse.py --selftest
          python3 Tools/Turbo/wrangler_auth_diag.py --selftest
          python3 Tools/Codespaces/mobile_license.py --selftest
          node --check Tools/Turbo/worker.mjs
          node Tools/Turbo/watch_test.mjs
          node Tools/Turbo/transaction_test.mjs
          bash -n Tools/Turbo/remote_install.sh
          bash -n Tools/Turbo/ensure_agent.sh
          bash -n Tools/Codespaces/termux_controller.sh
          bash -n Tools/Codespaces/termux_functions.sh
          bash -n Tools/Codespaces/install_termux_commands.sh
          bash -n Tools/Codespaces/termux_cf_runner.sh
          bash -n Tools/Codespaces/termux_switch.sh
          bash -n Tools/Codespaces/termux_cloudflare_switch.sh
          bash -n Tools/Codespaces/termux_unity_login_recover.sh
          bash -n Tools/Codespaces/auto_provision_codespace.sh
          bash -n Tools/Turbo/cloudflare_account_switch_linux.sh
          python3 -m py_compile Tools/Turbo/bootstrap_transaction.py
          python3 -m json.tool Tools/Turbo/wrangler.jsonc >/dev/null
  bootstrap:
    concurrency:
      group: aaris-turbo-bootstrap
      cancel-in-progress: false
    if: >-
      github.repository == 'sundamunda289-art/Unity-Game-Aris' &&
      ((github.event_name == 'workflow_dispatch' && github.actor == 'sundamunda289-art') ||
       (github.event_name == 'issue_comment' && github.event.issue.number == 77 &&
        github.event.comment.user.login == 'sundamunda289-art' &&
        (github.event.comment.body == 'TURBO START' || startsWith(github.event.comment.body, 'TURBO START '))))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
      AARIS_CANDIDATE_CREDENTIAL: ${{ secrets[inputs.credential_secret || 'AARIS_UNUSED'] }}
      INPUT_CREDENTIAL_SECRET: ${{ inputs.credential_secret || '' }}
      INPUT_TRANSACTION_ID: ${{ inputs.transaction_id || '' }}
      INPUT_BROKER: ${{ inputs.candidate_broker || '' }}
      INPUT_MACHINE: ${{ inputs.machine || 'auto' }}
      EXPECTED_HOST_LOGIN: ${{ inputs.hosting_login || '' }}
      ISSUE_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
    steps:
      - name: Validate immutable source against canonical main before executing it
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE: ${{ inputs.source_sha || '' }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = "sundamunda289-art/Unity-Game-Aris"
          def api(path):
              r = subprocess.run(["gh", "api", path], text=True, capture_output=True)
              if r.returncode:
                  raise SystemExit("Canonical source verification unavailable")
              return json.loads(r.stdout)
          main = api("repos/" + repo + "/git/ref/heads/main")["object"]["sha"]
          source = os.environ["REQUESTED_SOURCE"] or main
          if not re.fullmatch(r"[0-9a-f]{40}", source):
              raise SystemExit("Invalid canonical source SHA")
          comparison = api("repos/" + repo + "/compare/" + source + "..." + main)
          if (comparison.get("status") not in ("ahead", "identical") or
                  comparison.get("merge_base_commit", {}).get("sha") != source):
              raise SystemExit("Source is not reviewed canonical main history")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("sha=" + source + "\n")
          PY
      - uses: actions/checkout@v4
        with:
          repository: sundamunda289-art/Unity-Game-Aris
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          lfs: false
      - name: Prepare exact Codespace and candidate agent through signed canonical OIDC
        env:
          AARIS_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 Tools/Turbo/bootstrap_transaction.py
