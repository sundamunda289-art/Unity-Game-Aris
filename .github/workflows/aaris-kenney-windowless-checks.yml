name: Kenney CC0 windowless house source checks

on:
  pull_request:
    paths:
      - "Tools/Buildings/**"
      - "Assets/AarisWorld/Models/KenneyWindowlessHouses/**"
      - "Assets/AarisWorld/Editor/AarisKenneyWindowlessBaker.cs"
      - ".github/workflows/aaris-kenney-windowless-checks.yml"

permissions:
  contents: write

jobs:
  verify-kenney-windowless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout non-LFS script source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Python scripts parse
        run: |
          python3 -m py_compile \
            Tools/Buildings/generate_kenney_windowless.py \
            Tools/Buildings/check_kenney_windowless.py
      - name: Verify pinned CC0 source, mesh budgets and physical open entrance
        run: python3 Tools/Buildings/check_kenney_windowless.py
      - name: Generate distributable author-time OBJ assets
        run: python3 Tools/Buildings/generate_kenney_windowless.py
      - name: Upload verified house assets for review
        uses: actions/upload-artifact@v4
        with:
          name: aaris-kenney-windowless-cc0-houses
          path: Assets/AarisWorld/Models/KenneyWindowlessHouses/
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated assets into this guarded feature branch only
        if: >-
          ${{ github.event.pull_request.head.repo.full_name == github.repository &&
              github.event.pull_request.head.ref == 'feature/kenney-windowless-mobile-houses-20261111' }}
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          target='Assets/AarisWorld/Models/KenneyWindowlessHouses'
          test -f "$target/Kenney-CC0-License.txt"
          test -f "$target/colormap.png"
          test "$(find "$target" -maxdepth 1 -name 'AarisWindowless_*.obj' | wc -l)" -eq 7
          git add -- "$target"
          if git diff --cached --quiet; then
            echo "All generated model assets are already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets(houses): persist 7 licensed Kenney CC0 windowless mesh variants"
            # No force push. An unrelated branch change makes this fail safely.
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
