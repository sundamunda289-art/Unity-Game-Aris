name: Native deep forest PR Unity review
on:
  push:
    branches: ['review/native-heavy-forest-v1-20261109']
    paths:
      - 'Assets/TerrainDemoScene_URP/Prefabs/Trees/**'
      - 'Tools/Validation/test_tree_proportions.py'
      - 'Tools/Codespaces/forest_review_capture.sh'
      - '.github/workflows/aaris-forest-review-preview.yml'
permissions:
  contents: read
  actions: read
jobs:
  native-review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Check prefab structure without Unity
        run: |
          python3 Tools/Validation/test_tree_proportions.py
          python3 Tools/Validation/test_mobile_tree_shadows.py
          bash -n Tools/Codespaces/forest_review_capture.sh
      - name: Render real source from current PR commit in original licensed Codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          RUNNER_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}" || { echo FOREST_REVIEW_CODESPACE_TOKEN_UNAVAILABLE; exit 10; }
          CS=aaris-ai-ubuntu-minimal-jrg7rgvx5rr435wpp
          gh codespace list -R "$REPO" --json name,state --limit 30 | jq -e --arg c "$CS" 'any(.[]; .name==$c and .state=="Available")' >/dev/null || {
            echo FOREST_REVIEW_CODESPACE_NOT_AVAILABLE; exit 11;
          }
          mkdir -p "$RUNNER_TEMP/tree-package" forest-review
          GH_TOKEN="$RUNNER_GITHUB_TOKEN" gh run download 42472771253 -R "$REPO" \
            --name aaris-codespace-42472771253 -D "$RUNNER_TEMP/tree-package" >/dev/null
          ARCHIVE="$RUNNER_TEMP/tree-package/mass-package.tar.gz"
          test "$(stat -c '%s' "$ARCHIVE")" = 4757727
          test "$(sha256sum "$ARCHIVE" | cut -d ' ' -f1)" = "234024b842e8cc5e1253607ce41b5a6aebec6a7abd3c9fd81837bc960a24197d"
          timeout 180 gh codespace ssh -c "$CS" -- \
            'bash -c "umask 077; mkdir -p /tmp/aaris-codespaces/scene-probe; cat > /tmp/aaris-codespaces/scene-probe/verified-tree-mass-package.tar.gz"' \
            < "$ARCHIVE" >/dev/null
          checksum="$(timeout 50 gh codespace ssh -c "$CS" -- \
            'sha256sum /tmp/aaris-codespaces/scene-probe/verified-tree-mass-package.tar.gz' | cut -d ' ' -f1 | tr -d '\r\n')"
          test "$checksum" = "234024b842e8cc5e1253607ce41b5a6aebec6a7abd3c9fd81837bc960a24197d"
          timeout 3300 gh codespace ssh -c "$CS" -- "bash -s -- $CURRENT_SHA" \
            < Tools/Codespaces/forest_review_capture.sh >forest-review/native-safe.log
          grep -qx FOREST_REVIEW_RENDER_COMPLETED forest-review/native-safe.log
          for name in town-detail.png town-context.png forest-detail.png forest-context.png town-report.json forest-report.json; do
            timeout 180 gh codespace ssh -c "$CS" -- \
              "base64 /tmp/aaris-codespaces/forest-review/$name" > "$RUNNER_TEMP/$name.b64"
            base64 --decode "$RUNNER_TEMP/$name.b64" > "forest-review/$name"
            rm -f "$RUNNER_TEMP/$name.b64"
          done
          python3 - <<'PYSANITY'
          from pathlib import Path
          import json
          p=Path("forest-review")
          for site in ("town","forest"):
            j=json.loads((p/(site+"-report.json")).read_text())
            assert j["status"]=="passed" and j["terrainTiles"]==4
            for mode in ("detail","context"):
              f=p/(site+"-"+mode+".png")
              assert f.stat().st_size>8192 and f.read_bytes()[:8]==b"\x89PNG\r\n\x1a\n"
          print("FOREST_REVIEW_TWO_REAL_UNITY_CAMERA_VIEWS_VERIFIED")
          PYSANITY
      - name: Upload read-only native Unity photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaris-forest-native-review-${{ github.run_id }}
          path: forest-review/
          if-no-files-found: warn
          retention-days: 3
